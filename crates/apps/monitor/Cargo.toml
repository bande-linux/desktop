[package]
name = "bande-monitor"
description = "system monitor for the Bande desktop"
version = "0.1.6"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
accesskit.workspace = true
rustix = { workspace = true, features = ["event", "net", "param", "process"] }
tracing.workspace = true
zbus.workspace = true
bande-app.workspace = true
bande-app-menu.workspace = true
bande-l10n.workspace = true
bande-status.workspace = true
bande-toolkit.workspace = true
bande-xdg.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter, fonts-manrope, fonts-jetbrains-mono"
recommends = "bande-files"
extended-description = """\
The system monitor of the Bande desktop: lists running apps with their \
processes and shows CPU, memory, disk and network use, and quits or force \
quits any app."""
assets = [
    ["target/release/bande-monitor", "usr/bin/", "755"],
    ["data/org.bande.SystemMonitor.desktop", "usr/share/applications/", "644"],
    ["target/release/deb-assets/bande-monitor/org.bande.SystemMonitor.metainfo.xml", "usr/share/metainfo/", "644"],
    ["target/release/deb-assets/bande-monitor/copyright", "usr/share/doc/bande-monitor/copyright", "644"],
    ["target/release/deb-assets/bande-monitor/changelog.gz", "usr/share/doc/bande-monitor/", "644"],
    ["target/release/deb-assets/bande-monitor/man/*", "usr/share/man/man1/", "644"],
    ["data/org.bande.SystemMonitor.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["target/release/l10n/development/bande-monitor/*", "usr/share/bande/l10n/bande-monitor/", "644"],
]
