[package]
name = "bande-secrets"
description = "Bande keychain: the Secret Service of the Bande desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
async-channel.workspace = true
async-executor.workspace = true
async-io.workspace = true
async-lock.workspace = true
async-process.workspace = true
futures-lite.workspace = true
oo7.workspace = true
rustix = { workspace = true, features = ["fs", "net", "process"] }
tracing.workspace = true
bande-log.workspace = true
bande-xdg.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
serde.workspace = true
tempfile.workspace = true
bande-test-bus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, bande-icon-theme, default-dbus-session-bus | dbus-session-bus, fonts-inter, fonts-manrope, init-system-helpers (>= 1.66)"
recommends = "libpam-bande-secrets"
provides = "org.freedesktop.secrets"
conflicts = "gnome-keyring"
replaces = "gnome-keyring"
extended-description = """\
The keychain of the Bande desktop: it keeps the passwords apps save, such \
as mail accounts, calendars, browsers and VPNs, encrypted with the login \
password, and serves them through the freedesktop Secret Service. The \
login keychain is unlocked when you log in and follows password changes. \
When an \
app asks for a password another app saved, the keychain asks first. \
Started with the session or by D-Bus activation."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/bande-secrets", "usr/libexec/", "755"],
    ["target/release/bande-secrets-prompt", "usr/libexec/", "755"],
    ["data/bande-secrets.service", "usr/lib/systemd/user/", "644"],
    ["data/bande-secrets.socket", "usr/lib/systemd/user/", "644"],
    ["data/org.bande.Secrets.service", "usr/share/dbus-1/services/", "644"],
    ["target/release/l10n/development/bande-secrets-prompt/*", "usr/share/bande/l10n/bande-secrets-prompt/", "644"],
    ["target/release/l10n/development/bande-secrets/*", "usr/share/bande/l10n/bande-secrets/", "644"],
]

[lints]
workspace = true
