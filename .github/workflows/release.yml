name: release
run-name: "${{ github.ref_type == 'tag' && format('Release desktop {0}', github.ref_name) || format('Unpublished build of {0}', github.ref_name) }}"

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    container: debian:testing
    timeout-minutes: 60
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
      - run: ci/release/verify.sh --setup lint
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ci/release/verify.sh lint

  test:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:testing
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
    timeout-minutes: 120
    steps:
      - name: Free disk space on the host
        run: rm -rf /host/dotnet/* /host/android/* /host/ghc/* && df -h /
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
      - run: ci/release/verify.sh --setup test
      - uses: Swatinem/rust-cache@v2
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ci/release/verify.sh test

  debs:
    name: debs (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:testing
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
    timeout-minutes: 240
    steps:
      - name: Free disk space on the host
        run: rm -rf /host/dotnet/* /host/android/* /host/ghc/* && df -h /
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
      - run: ci/release/verify.sh --setup debs
      - uses: Swatinem/rust-cache@v2
        with:
          key: debs-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ci/release/verify.sh debs
      - name: Disk and memory after the build
        if: always()
        run: df -h / && grep -E "MemTotal|MemAvailable" /proc/meminfo
      - uses: actions/upload-artifact@v7
        with:
          name: bande-debs-${{ matrix.arch }}
          path: target/debian/*.deb
          if-no-files-found: error

  deb-all:
    runs-on: ubuntu-24.04
    container: debian:testing
    timeout-minutes: 15
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check that the tagged commit is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: ci/release/verify.sh --setup all
      - run: ci/release/verify.sh all
      - uses: actions/upload-artifact@v7
        with:
          name: bande-debs-all
          path: target/debian-all/*.deb
          if-no-files-found: error

  install:
    name: install (${{ matrix.arch }})
    needs: [debs, deb-all]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    container: debian:testing
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: bande-debs-${{ matrix.arch }}
          path: install-debs
      - uses: actions/download-artifact@v7
        with:
          name: bande-debs-all
          path: install-debs
      - name: Install bande-desktop into a clean Debian testing, alone and next to another display manager
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          ci/deb/install-test/run.sh install-debs
      - name: Read the colour scheme through xdg-desktop-portal
        run: ci/deb/install-test/portal-frontend.sh
