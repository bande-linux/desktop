[workspace]
resolver = "3"
members = ["crates/*/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/bande-linux/desktop"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
accesskit = "=0.25.2"
accesskit_unix = "=0.24.1"
ash = "=0.38.0"
blocking = "=1.6.2"
bzip2 = "=0.6.1"
flate2 = "=1.1.10"
fluent-bundle = "=0.16.0"
fontique = { version = "=0.12.0", features = ["fontconfig-dlopen"] }
icu_calendar = "=2.4.0"
icu_datetime = "=2.4.0"
icu_locale_core = "=2.4.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
jiff = "=0.2.38"
kdl = { version = "=6.7.1", default-features = false, features = ["span"] }
libc = "=0.2.191"
libloading = "=0.8.9"
lzma-rust2 = { version = "=0.24.0", default-features = false, features = ["std", "xz"] }
md-5 = "=0.10.6"
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-out"] }
parley = { version = "=0.12.0", features = ["complex-scripts"] }
pipewire = "=0.10.1"
png = "=0.18.1"
pollster = "=1.0.1"
raw-window-handle = "=0.6.2"
resvg = { version = "=0.49.0", default-features = false }
roxmltree = "=0.21.2"
rustix = { version = "=1.1.6", features = ["event", "param", "process"] }
ruzstd = "=0.9.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
skrifa = "=0.44.0"
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend"] }
tar = "=0.4.46"
tempfile = "=3.27.0"
tracing = "=0.1.44"
tracing-journald = "=0.3.2"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["ansi", "fmt", "registry", "std", "tracing-log"] }
unic-langid = "=0.9.6"
vello_cpu = "=0.3.0"
vello_gpu = { version = "=0.3.0", default-features = false, features = ["wgpu", "text"] }
wayland-backend = { version = "=0.3.17", features = ["log"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
wayland-scanner = "=0.31.11"
wayland-server = "=0.31.14"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
writeable = "=0.6.4"
xkbcommon = "=0.8.0"
zbus = "=5.19.0"
zeroize = { version = "=1.8.1", features = ["serde"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2"] }
bande-app = { path = "crates/libs/app" }
bande-app-menu = { path = "crates/libs/app-menu" }
bande-app-settings = { path = "crates/libs/app-settings" }
bande-audio = { path = "crates/libs/audio" }
bande-automount = { path = "crates/services/automount" }
bande-bar = { path = "crates/shell/bar" }
bande-bench = { path = "crates/testing/bench" }
bande-bluetooth = { path = "crates/libs/bluetooth" }
bande-bus = { path = "crates/libs/bus" }
bande-clipboard = { path = "crates/services/clipboard" }
bande-compositor = { path = "crates/platform/compositor" }
bande-config = { path = "crates/services/config" }
bande-controlcenter = { path = "crates/shell/controlcenter" }
bande-datetime = { path = "crates/libs/datetime" }
bande-design = { path = "crates/toolkit/design" }
bande-desktop-surface = { path = "crates/shell/desktop" }
bande-taskbar-model = { path = "crates/libs/taskbar-model" }
bande-edid = { path = "crates/libs/edid" }
bande-files = { path = "crates/apps/files" }
bande-fs = { path = "crates/libs/fs" }
bande-graphics = { path = "crates/toolkit/graphics" }
bande-greeter = { path = "crates/shell/greeter" }
bande-inbox = { path = "crates/libs/inbox" }
bande-keyboard = { path = "crates/libs/keyboard" }
bande-l10n = { path = "crates/libs/l10n" }
bande-launcher = { path = "crates/shell/launcher" }
bande-lock = { path = "crates/shell/lock" }
bande-log = { path = "crates/libs/log" }
bande-network = { path = "crates/libs/network" }
bande-printers = { path = "crates/libs/printers" }
bande-packages = { path = "crates/libs/packages" }
bande-notifications = { path = "crates/shell/notifications" }
bande-notify = { path = "crates/services/notify" }
bande-polkit = { path = "crates/services/polkit" }
bande-power = { path = "crates/services/power" }
bande-preview = { path = "crates/libs/preview" }
bande-protocols = { path = "crates/platform/protocols" }
bande-render = { path = "crates/platform/render" }
bande-review = { path = "crates/testing/review" }
bande-sample = { path = "crates/testing/sample" }
bande-screenshot = { path = "crates/shell/screenshot" }
bande-search = { path = "crates/libs/search" }
bande-settings = { path = "crates/apps/settings" }
bande-settings-panes = { path = "crates/libs/settings-panes" }
bande-shell = { path = "crates/shell/shell" }
bande-sound = { path = "crates/services/sound", default-features = false }
bande-spring = { path = "crates/libs/spring" }
bande-status = { path = "crates/libs/status" }
bande-test-bus = { path = "crates/testing/test-bus" }
bande-test-wayland = { path = "crates/testing/test-wayland" }
bande-thumbnails = { path = "crates/libs/thumbnails" }
bande-toolkit = { path = "crates/toolkit/toolkit" }
bande-toolkit-platform = { path = "crates/toolkit/platform" }
bande-tray = { path = "crates/services/tray" }
bande-volumes = { path = "crates/libs/volumes" }
bande-wallpaper = { path = "crates/libs/wallpaper" }
bande-watch = { path = "crates/libs/watch" }
bande-widgets = { path = "crates/toolkit/widgets" }
bande-xdg = { path = "crates/libs/xdg" }
xdg-desktop-portal-bande = { path = "crates/services/portal" }

[profile.dev]
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
