<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ · Unbound review</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #111214;
    --panel: #1a1b1e;
    --line: #2a2c30;
    --text: #e8e8ea;
    --muted: #9a9ca3;
    --accent: #5aa2ff;
    --warn: #f0b44c;
    --bad: #ff6b6b;
    --good: #5fd18b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
    padding: 18px 24px 12px;
  }
  h1 { margin: 0; font-size: 20px; font-weight: 600; }
  h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; color: var(--muted); }
  .facts { color: var(--muted); }
  .badge {
    display: inline-block;
    padding: 1px 8px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge.ok { background: rgba(95, 209, 139, 0.15); color: var(--good); }
  .badge.warn { background: rgba(240, 180, 76, 0.15); color: var(--warn); }
  .badge.bad { background: rgba(255, 107, 107, 0.15); color: var(--bad); }
  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 380px;
    gap: 16px;
    padding: 0 24px 24px;
  }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  .stage {
    position: relative;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
    align-self: start;
  }
  video { display: block; width: 100%; height: auto; }
  .caption {
    position: absolute;
    left: 50%;
    bottom: 64px;
    transform: translateX(-50%);
    max-width: 86%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    pointer-events: none;
  }
  .caption .note {
    background: rgba(20, 21, 24, 0.86);
    backdrop-filter: blur(8px);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 17px;
    text-align: center;
    transition: opacity 200ms ease;
  }
  .caption .step {
    background: rgba(20, 21, 24, 0.78);
    backdrop-filter: blur(8px);
    padding: 4px 10px;
    border-radius: 8px;
    font: 13px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    color: #cfd3da;
    transition: opacity 200ms ease;
  }
  .caption .hidden { opacity: 0; }
  .controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0 0;
    color: var(--muted);
  }
  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 7px;
    padding: 4px 10px;
    font: inherit;
    cursor: pointer;
  }
  button.active { border-color: var(--accent); color: var(--accent); }
  .steps {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
    padding: 6px;
  }
  .row {
    display: grid;
    grid-template-columns: 52px minmax(0, 1fr) auto;
    gap: 8px;
    align-items: baseline;
    padding: 6px 8px;
    border-radius: 7px;
    cursor: pointer;
  }
  .row:hover { background: #222327; }
  .row.current { background: rgba(90, 162, 255, 0.16); }
  .row .time { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
  .row .source {
    font: 12.5px/1.4 ui-monospace, "SF Mono", Menlo, monospace;
    overflow-wrap: anywhere;
  }
  .row.note .source {
    font: 14px/1.4 system-ui, -apple-system, sans-serif;
    color: var(--warn);
  }
  section { padding: 0 24px 24px; }
  .shots {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 16px;
  }
  figure {
    margin: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  figure img { display: block; width: 100%; height: auto; cursor: zoom-in; }
  figcaption {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
  }
  figcaption a { color: var(--accent); text-decoration: none; }
  pre {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px 16px;
    overflow-x: auto;
    font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
  }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <span id="state"></span>
  <span class="facts" id="facts"></span>
</header>
<main>
  <div>
    <div class="stage">
      <video id="video" controls preload="auto" playsinline></video>
      <div class="caption">
        <div class="note hidden" id="note"></div>
        <div class="step hidden" id="step"></div>
      </div>
    </div>
    <div class="controls">
      Speed
      <button data-rate="0.5">0.5×</button>
      <button data-rate="1" class="active">1×</button>
      <button data-rate="2">2×</button>
      <span style="margin-left:auto">Space plays or pauses · ← → jump between steps</span>
    </div>
  </div>
  <div class="steps" id="steps"></div>
</main>
<section>
  <h2>Shots</h2>
  <div class="shots" id="shots"></div>
</section>
<section>
  <h2>Scenario</h2>
  <pre id="scenario"></pre>
</section>
<script id="timeline" type="application/json">"__TIMELINE__"</script>
<script>
  const timeline = JSON.parse(document.getElementById("timeline").textContent);
  const video = document.getElementById("video");
  const noteBox = document.getElementById("note");
  const stepBox = document.getElementById("step");
  const steps = timeline.steps;
  const visible = steps.filter((step) => step.kind !== "wait");

  const clock = (seconds) => {
    const minutes = Math.floor(seconds / 60);
    const rest = (seconds - minutes * 60).toFixed(1).padStart(4, "0");
    return `${minutes}:${rest}`;
  };
  const element = (tag, attributes, ...children) => {
    const node = document.createElement(tag);
    Object.assign(node, attributes);
    node.append(...children);
    return node;
  };
  const statusBadge = (status) => {
    if (status === "ok") return "";
    const tone = status === "timed out" ? "warn" : "bad";
    return element("span", { className: `badge ${tone}`, textContent: status });
  };
  const seek = (seconds) => {
    video.currentTime = Math.max(0, seconds - 0.3);
    video.play();
  };

  document.getElementById("title").textContent = timeline.title;
  const failures = steps.filter((step) => step.status !== "ok").length;
  document.getElementById("state").append(
    timeline.completed
      ? element("span", {
          className: `badge ${failures ? "warn" : "ok"}`,
          textContent: failures ? `${failures} step${failures > 1 ? "s" : ""} timed out` : "completed",
        })
      : element("span", { className: "badge bad", textContent: "stopped early" })
  );
  document.getElementById("facts").textContent =
    `${clock(timeline.duration)} · ${timeline.width}×${timeline.height} · ${steps.length} steps`;
  document.getElementById("scenario").textContent = timeline.scenario;
  video.src = timeline.video;

  const rows = visible.map((step) => {
    const row = element(
      "div",
      { className: `row ${step.kind === "note" ? "note" : ""}` },
      element("span", { className: "time", textContent: clock(step.start) }),
      element("span", { className: "source", textContent: step.kind === "note" ? step.text : step.source }),
      statusBadge(step.status)
    );
    row.addEventListener("click", () => seek(step.start));
    document.getElementById("steps").append(row);
    return row;
  });

  const shots = steps.filter((step) => step.shot);
  const gallery = document.getElementById("shots");
  if (!shots.length) gallery.append(element("p", { className: "empty", textContent: "No shots in this scenario." }));
  for (const step of shots) {
    const jump = element("a", { href: "#", textContent: clock(step.start) });
    jump.addEventListener("click", (event) => {
      event.preventDefault();
      window.scrollTo({ top: 0, behavior: "smooth" });
      seek(step.start);
    });
    gallery.append(
      element(
        "figure",
        {},
        element("a", { href: step.shot, target: "_blank" }, element("img", { src: step.shot, alt: step.text, loading: "lazy" })),
        element("figcaption", {}, element("span", { textContent: step.text }), jump)
      )
    );
  }

  let shown = -1;
  const show = () => {
    const now = video.currentTime;
    let current = -1;
    visible.forEach((step, index) => { if (step.start <= now) current = index; });
    const note = [...steps].reverse().find((step) => step.kind === "note" && step.start <= now);
    noteBox.textContent = note ? note.text : "";
    noteBox.classList.toggle("hidden", !note);
    const step = current >= 0 && visible[current].kind !== "note" ? visible[current] : null;
    const fresh = step && now - step.end < 1.2;
    stepBox.textContent = step ? step.source : "";
    stepBox.classList.toggle("hidden", !fresh);
    if (current !== shown) {
      rows[shown]?.classList.remove("current");
      rows[current]?.classList.add("current");
      rows[current]?.scrollIntoView({ block: "nearest", behavior: "smooth" });
      shown = current;
    }
  };
  const follow = () => {
    show();
    if (!video.paused) requestAnimationFrame(follow);
  };
  video.addEventListener("play", follow);
  video.addEventListener("seeked", show);
  video.addEventListener("loadedmetadata", show);

  for (const button of document.querySelectorAll("[data-rate]")) {
    button.addEventListener("click", () => {
      video.playbackRate = Number(button.dataset.rate);
      for (const other of document.querySelectorAll("[data-rate]")) other.classList.toggle("active", other === button);
    });
  }
  document.addEventListener("keydown", (event) => {
    if (event.target !== document.body && event.target !== video) return;
    if (event.key === " ") {
      event.preventDefault();
      video.paused ? video.play() : video.pause();
    } else if (event.key === "ArrowRight" || event.key === "ArrowLeft") {
      event.preventDefault();
      const now = video.currentTime + 0.31;
      const starts = visible.map((step) => step.start);
      const target = event.key === "ArrowRight"
        ? starts.find((start) => start > now + 0.05)
        : [...starts].reverse().find((start) => start < now - 0.4);
      if (target !== undefined) seek(target);
    }
  });
</script>
</body>
</html>
