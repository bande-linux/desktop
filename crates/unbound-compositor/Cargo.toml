[package]
name = "unbound-compositor"
description = "Unbound Wayland compositor"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
rustix.workspace = true
smithay.workspace = true
unbound-toolkit.workspace = true
wgpu.workspace = true

[dev-dependencies]
image.workspace = true
image-compare.workspace = true
unbound-test-wayland.workspace = true
wayland-client.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "x11"
depends = "$auto, libvulkan1, mesa-vulkan-drivers | vulkan-icd"
extended-description = """\
Headless Wayland compositor built on Smithay. It serves wl_compositor, \
wl_shm and xdg_wm_base clients and renders their windows offscreen \
through wgpu on Vulkan, including Mesa's lavapipe CPU driver."""
