[package]
name = "bande-sound"
description = "Bande event sounds: an original sound theme played through PipeWire"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["service"]
service = ["dep:bande-audio", "dep:bande-bus", "dep:bande-log"]

[[bin]]
name = "bande-sound"
required-features = ["service"]

[dependencies]
tracing.workspace = true
bande-audio = { workspace = true, optional = true }
bande-bus = { workspace = true, optional = true }
bande-log = { workspace = true, optional = true }
zbus.workspace = true

[lints]
workspace = true
