[package]
name = "unbound-file-chooser"
description = "Unbound Open and Save dialogs for the xdg-desktop-portal FileChooser"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
tracing.workspace = true
unbound-files.workspace = true
unbound-fs.workspace = true
unbound-l10n.workspace = true
unbound-log.workspace = true
unbound-toolkit.workspace = true
unbound-volumes.workspace = true
unbound-xdg.workspace = true
xdg-desktop-portal-unbound.workspace = true

[dev-dependencies]
tempfile.workspace = true
unbound-golden.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter"
extended-description = """\
The Open and Save dialogs of the Unbound desktop, shown by \
xdg-desktop-portal-unbound for every app that asks the FileChooser portal: \
favourite places and volumes in a sidebar, a path bar, a sortable list \
with type-to-jump, file type filters, New Folder when saving, and the last \
folder remembered for each app."""
assets = [
    ["target/release/unbound-file-chooser", "usr/libexec/", "755"],
]

[lints]
workspace = true
