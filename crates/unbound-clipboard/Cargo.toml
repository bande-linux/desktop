[package]
name = "unbound-clipboard"
description = "Unbound clipboard daemon: keeps the selection after the copying app quits"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
rustix.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true

[dev-dependencies]
smithay.workspace = true
tempfile.workspace = true
unbound-compositor.workspace = true
unbound-test-wayland.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "x11"
extended-description = """\
Takes over each new clipboard and primary selection through \
ext-data-control-v1 and serves it after the copying application has \
quit. unbound-compositor starts it on a socket pair and offers \
ext-data-control on that connection only."""
