[package]
name = "bande-files"
description = "Bande Files: the file manager of the Bande desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
bande-app.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
tracing.workspace = true
bande-app-menu.workspace = true
bande-app-settings.workspace = true
bande-config.workspace = true
bande-fs.workspace = true
bande-inbox.workspace = true
bande-l10n.workspace = true
bande-preview.workspace = true
bande-search.workspace = true
bande-sound.workspace = true
bande-thumbnails.workspace = true
bande-toolkit.workspace = true
bande-volumes.workspace = true
bande-xdg.workspace = true
jiff.workspace = true
zbus.workspace = true

[dev-dependencies]
rustix = { workspace = true, features = ["process"] }
tempfile.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-dejavu-core, fonts-inter, fonts-manrope, fonts-jetbrains-mono"
extended-description = """\
The file manager of the Bande desktop: folders open in Miller columns \
driven by the arrow keys, as in the Finder's column view, and Space shows \
the selected file in Quick Look."""
assets = [
    ["target/release/bande-files", "usr/bin/", "755"],
    ["data/org.bande.Files.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Files.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.Files.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[lints]
workspace = true
