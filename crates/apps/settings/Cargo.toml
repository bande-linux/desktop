image.workspace = true
jiff.workspace = true
libc.workspace = true
libloading.workspace = true
rustix = { workspace = true, features = ["fs", "pty"] }
tracing.workspace = true
bande-app-menu.workspace = true
bande-audio.workspace = true
bande-bluetooth.workspace = true
bande-config.workspace = true
bande-backup.workspace = true
bande-datetime.workspace = true
bande-fs.workspace = true
bande-keyboard.workspace = true
bande-l10n.workspace = true
