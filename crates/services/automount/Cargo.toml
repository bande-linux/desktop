[package]
name = "unbound-automount"
description = "Unbound removable media mounting"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
rustix = { workspace = true, features = ["fs"] }
tracing.workspace = true
unbound-bus.workspace = true
unbound-fs.workspace = true
unbound-l10n.workspace = true
unbound-log.workspace = true
unbound-notify.workspace = true
unbound-xdg.workspace = true
zbus.workspace = true

[dev-dependencies]
unbound-test-bus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, dbus-session-bus | default-dbus-session-bus, init-system-helpers (>= 1.66), udisks2"
extended-description = """\
Mounts removable drives through UDisks2 as they appear, warns when a \
mounted drive is disconnected without being ejected, and warns once when \
the startup disk or the home folder runs out of space. Started with the \
graphical session."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/unbound-automount", "usr/bin/", "755"],
    ["data/unbound-automount.service", "usr/lib/systemd/user/", "644"],
]

[lints]
workspace = true
