[package]
name = "unbound-dock"
description = "Unbound Dock: kept and running apps on a screen edge"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
tracing.workspace = true
unbound-config.workspace = true
unbound-fs.workspace = true
unbound-l10n.workspace = true
unbound-log.workspace = true
unbound-toolkit.workspace = true
unbound-xdg.workspace = true
zbus.workspace = true

[dev-dependencies]
image.workspace = true
image-compare.workspace = true
tempfile.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter"
extended-description = """\
The Dock of the Unbound desktop: the apps kept in it, the running apps \
and the Trash, with app badges and progress. unbound-compositor starts \
it on the screen edge named in config.kdl."""

[lints]
workspace = true
