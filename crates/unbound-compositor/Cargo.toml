[package]
name = "unbound-compositor"
description = "Unbound Wayland compositor"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
rustix.workspace = true
smithay = { workspace = true, features = ["backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "desktop"] }
unbound-protocols = { workspace = true, features = ["server"] }
unbound-render.workspace = true
zbus.workspace = true

[dev-dependencies]
image.workspace = true
image-compare.workspace = true
rustix = { workspace = true, features = ["fs", "mm"] }
unbound-greeter.workspace = true
unbound-test-bus.workspace = true
unbound-test-wayland.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, libvulkan1, mesa-vulkan-drivers | vulkan-icd, systemd"
recommends = "unbound-clipboard, unbound-panel, unbound-launcher, unbound-term, unbound-lock, unbound-screenshot, unbound-files, unbound-settings"
suggests = "fcitx5"
extended-description = """\
Headless Wayland compositor built on Smithay. It serves wl_compositor, \
wl_shm, linux-dmabuf-v1 and xdg_wm_base clients and renders their windows offscreen \
with its own Vulkan renderer, including on Mesa's lavapipe CPU driver."""
assets = [
    ["target/release/unbound-compositor", "usr/bin/", "755"],
    ["debian/unbound-session", "usr/bin/", "755"],
    ["debian/unbound-compositor.service", "usr/lib/systemd/user/", "644"],
    ["debian/unbound-session.target", "usr/lib/systemd/user/", "644"],
    ["debian/unbound.desktop", "usr/share/wayland-sessions/", "644"],
]
