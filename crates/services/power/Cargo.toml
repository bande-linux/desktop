[package]
name = "bande-power"
description = "Bande power service: sleep locking, battery alerts and idle inhibition"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
rustix.workspace = true
tracing.workspace = true
bande-audio.workspace = true
bande-bus.workspace = true
bande-l10n.workspace = true
bande-log.workspace = true
bande-notify.workspace = true
bande-sound.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
zbus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, default-dbus-session-bus | dbus-session-bus, init-system-helpers (>= 1.66), default-logind | logind"
recommends = "upower, pipewire, bande-config"
extended-description = """\
Locks the session before the computer sleeps through a logind delay \
inhibitor, makes the power button lock the session, posts low and critical battery notifications from UPower, \
serves org.freedesktop.ScreenSaver so applications can keep the screen \
on, holding a logind idle inhibitor for each request, and keeps the \
computer from sleeping when idle while a sound stream runs. Sleep is off \
until s2idle is reliable on Apple silicon. Controls the brightness of each \
connected display that has one, through its backlight or DDC/CI."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/bande-power", "usr/bin/", "755"],
    ["data/bande-power.service", "usr/lib/systemd/user/", "644"],
    ["data/org.bande.Power.service", "usr/share/dbus-1/services/", "644"],
    ["data/org.bande.Brightness.service", "usr/share/dbus-1/services/", "644"],
    ["data/70-bande-ddc.rules", "usr/lib/udev/rules.d/", "644"],
    ["data/bande-ddc.conf", "usr/lib/modules-load.d/", "644"],
    ["data/logind.conf", "usr/lib/systemd/logind.conf.d/bande-power.conf", "644"],
    ["data/sleep.conf", "usr/lib/systemd/sleep.conf.d/bande-power.conf", "644"],
    ["target/release/l10n/development/bande-power/*", "usr/share/bande/l10n/bande-power/", "644"],
]

[lints]
workspace = true
