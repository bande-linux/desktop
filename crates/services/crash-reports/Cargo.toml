[package]
name = "bande-crash-reports"
description = "Bande crash reports: one local, dated report for every crash, hang and failed restart"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bande-log.workspace = true
jiff.workspace = true
rustc-demangle.workspace = true
rustix = { workspace = true, features = ["fs"] }
serde_json.workspace = true
tracing.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, systemd (>= 257), init-system-helpers (>= 1.66), systemd-coredump, libdw1t64"
extended-description = """\
Writes one dated text report for every crash, every hang that was stopped, \
every failed session service, every kernel panic and every restart without a \
clean shutdown, with a stack trace and the last log lines. Settings shows the \
reports. They stay on this computer: the service has no network at all, and it \
runs only after a failure, at boot and at login."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/bande-crash-reports", "usr/libexec/", "755"],
    ["data/bande-crash-reports@.service", "usr/lib/systemd/system/", "644"],
    ["data/coredump-drop-in.conf", "usr/lib/systemd/system/systemd-coredump@.service.d/50-bande-crash-reports.conf", "644"],
    ["data/login-drop-in.conf", "usr/lib/systemd/system/user@.service.d/50-bande-crash-reports.conf", "644"],
]

[lints]
workspace = true
