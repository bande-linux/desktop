[package]
name = "bande-sound"
description = "Bande event sounds: an original sound theme played through PipeWire"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["service"]
service = ["dep:bande-audio", "dep:bande-bus", "dep:bande-log"]

[[bin]]
name = "bande-sound"
required-features = ["service"]

[dependencies]
tracing.workspace = true
bande-audio = { workspace = true, optional = true }
bande-bus = { workspace = true, optional = true }
bande-log = { workspace = true, optional = true }
zbus.workspace = true

[dev-dependencies]
bande-config.workspace = true
bande-test-bus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, dbus-session-bus | default-dbus-session-bus, init-system-helpers (>= 1.66)"
recommends = "pipewire, wireplumber, bande-config"
extended-description = """\
Plays the Bande desktop's event sounds (alerts, notifications, the \
volume tick, screenshots, emptying the Trash, plugging in power and low \
battery) through PipeWire, following the sound settings in config.kdl, \
and installs them as the Bande XDG sound theme for other apps."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/bande-sound", "usr/bin/", "755"],
    ["data/bande-sound.service", "usr/lib/systemd/user/", "644"],
    ["data/org.bande.Sound.service", "usr/share/dbus-1/services/", "644"],
    ["../../../data/sounds/Bande/index.theme", "usr/share/sounds/Bande/", "644"],
    ["../../../data/sounds/Bande/stereo/*.wav", "usr/share/sounds/Bande/stereo/", "644"],
]

[lints]
workspace = true
