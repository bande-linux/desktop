name: language packs
run-name: "Language packs ${{ github.ref_name }}"

on:
  push:
    tags: ['l10n-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]', 'l10n-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9].[0-9]*']

concurrency:
  group: l10n-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  suites:
    uses: bande-linux/apt/.github/workflows/suites.yml@main

  packs:
    name: packs (${{ matrix.suite }})
    needs: suites
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.list) }}
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.suite }}
    timeout-minutes: 30
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check that the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: ci/release/verify.sh --setup all
      - name: Build the packs from the translations alone
        run: ci/release/build-packs.sh target/debian-l10n "$(ci/deb/version.sh)"
      - name: Lintian
        run: |
          chmod 755 target target/debian-l10n
          chmod 644 target/debian-l10n/*.deb
          runuser -u nobody -- lintian --fail-on error,warning target/debian-l10n/*.deb
      - uses: actions/upload-artifact@v7
        with:
          name: bande-debs-${{ matrix.suite }}-all
          path: target/debian-l10n/*.deb
          if-no-files-found: error
