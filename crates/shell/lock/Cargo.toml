[package]
name = "bande-lock"
description = "Bande lock screen: locks the session until the user's password is entered"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bande-bus.workspace = true
accesskit.workspace = true
jiff.workspace = true
libc.workspace = true
libloading.workspace = true
rustix.workspace = true
tracing.workspace = true
bande-bar.workspace = true
bande-datetime.workspace = true
bande-inbox.workspace = true
bande-keyboard.workspace = true
bande-l10n.workspace = true
bande-log.workspace = true
bande-spring.workspace = true
bande-status.workspace = true
bande-toolkit.workspace = true
bande-wallpaper.workspace = true
bande-xdg.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
bande-golden.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter, libpam0g, libpam-runtime"
recommends = "bande-shell"
assets = [
    ["target/release/bande-lock", "usr/bin/", "755"],
    ["data/bande-lock.pam", "etc/pam.d/bande-lock", "644"],
]
extended-description = """\
The lock screen of the Bande desktop. Super+L, or the session \
going idle or to sleep, starts it; it covers every output through \
ext-session-lock-v1 and unlocks once PAM accepts the user's password."""

[lints]
workspace = true
