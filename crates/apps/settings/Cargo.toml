[package]
name = "unbound-settings"
description = "Unbound System Settings: panes for the desktop and its devices with ranked search"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
tracing.workspace = true
unbound-app-menu.workspace = true
unbound-audio.workspace = true
unbound-bluetooth.workspace = true
unbound-config.workspace = true
unbound-l10n.workspace = true
unbound-log.workspace = true
unbound-network.workspace = true
unbound-toolkit.workspace = true
wayland-client.workspace = true
zbus.workspace = true

[dev-dependencies]
image.workspace = true
image-compare.workspace = true
tempfile.workspace = true
unbound-compositor.workspace = true
unbound-test-bus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter, unbound-config"
extended-description = """\
System Settings of the Unbound desktop: Wi-Fi, Bluetooth, notifications, \
sound, appearance, the dock, displays, the lock screen and the keyboard, \
with a search field that ranks the matching settings and marks them. \
Every pane follows changes made elsewhere while it is open. Desktop \
settings go through org.unbound.Config, which writes config.kdl."""
recommends = "network-manager, bluez, pipewire, wireplumber, unbound-notify"
assets = [
    ["target/release/unbound-settings", "usr/bin/", "755"],
    ["data/org.unbound.Settings.desktop", "usr/share/applications/", "644"],
    ["data/org.unbound.Settings.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[lints]
workspace = true
