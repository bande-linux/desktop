[workspace]
resolver = "3"
members = ["crates/*/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/unbound-linux/desktop"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[workspace.dependencies]
ab_glyph = "=0.2.32"
accesskit = "=0.25.2"
accesskit_unix = "=0.24.1"
alacritty_terminal = { version = "=0.26.0", default-features = false }
ash = "=0.38.0"
atspi-common = "=0.13.0"
blocking = "=1.6.2"
bzip2 = "=0.6.1"
flate2 = "=1.1.10"
fluent-bundle = "=0.16.0"
fluent-syntax = "=0.12.0"
fontique = { version = "=0.12.0", features = ["fontconfig-dlopen"] }
icu_calendar = "=2.4.0"
icu_datetime = "=2.4.0"
icu_decimal = "=2.4.0"
icu_locale_core = "=2.4.0"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
image-compare = "=0.5.0"
intl-memoizer = "=0.5.3"
jiff = "=0.2.38"
kdl = { version = "=6.7.1", default-features = false, features = ["span"] }
libc = "=0.2.191"
libloading = "=0.8.9"
lzma-rust2 = { version = "=0.24.0", default-features = false, features = ["std", "xz"] }
md-5 = "=0.10.6"
naga = { version = "=30.0.1", features = ["wgsl-in", "spv-out"] }
parley = { version = "=0.12.0", features = ["complex-scripts"] }
pipewire = "=0.10.1"
png = "=0.18.1"
pollster = "=1.0.1"
raw-window-handle = "=0.6.2"
resvg = { version = "=0.49.0", default-features = false }
roxmltree = "=0.21.2"
rustix = { version = "=1.1.6", features = ["event", "param", "process"] }
ruzstd = "=0.9.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
skrifa = "=0.44.0"
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend"] }
tar = "=0.4.46"
tempfile = "=3.27.0"
tracing = "=0.1.44"
tracing-journald = "=0.3.2"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["ansi", "fmt", "registry", "std", "tracing-log"] }
unic-langid = "=0.9.6"
vello_cpu = "=0.3.0"
vello_gpu = { version = "=0.3.0", default-features = false, features = ["wgpu", "text"] }
wayland-backend = { version = "=0.3.17", features = ["log"] }
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
wayland-scanner = "=0.31.11"
wayland-server = "=0.31.14"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
xkbcommon = "=0.8.0"
zbus = "=5.19.0"
zeroize = { version = "=1.8.1", features = ["serde"] }
zip = { version = "=9.1.3", default-features = false, features = ["deflate-flate2"] }
unbound-app-menu = { path = "crates/libs/app-menu" }
unbound-audio = { path = "crates/libs/audio" }
unbound-automount = { path = "crates/services/automount" }
unbound-bar = { path = "crates/shell/bar" }
unbound-bench = { path = "crates/testing/bench" }
unbound-bluetooth = { path = "crates/libs/bluetooth" }
unbound-bus = { path = "crates/libs/bus" }
unbound-clipboard = { path = "crates/services/clipboard" }
unbound-compositor = { path = "crates/platform/compositor" }
unbound-config = { path = "crates/services/config" }
unbound-controlcenter = { path = "crates/shell/controlcenter" }
unbound-datetime = { path = "crates/libs/datetime" }
unbound-design = { path = "crates/toolkit/design" }
unbound-desktop-surface = { path = "crates/shell/desktop" }
unbound-dock-model = { path = "crates/libs/dock-model" }
unbound-edid = { path = "crates/libs/edid" }
unbound-files = { path = "crates/apps/files" }
unbound-fs = { path = "crates/libs/fs" }
unbound-golden = { path = "crates/testing/golden" }
unbound-graphics = { path = "crates/toolkit/graphics" }
unbound-greeter = { path = "crates/shell/greeter" }
unbound-inbox = { path = "crates/libs/inbox" }
unbound-keyboard = { path = "crates/libs/keyboard" }
unbound-l10n = { path = "crates/libs/l10n" }
unbound-launcher = { path = "crates/shell/launcher" }
unbound-lock = { path = "crates/shell/lock" }
unbound-log = { path = "crates/libs/log" }
unbound-monitor = { path = "crates/apps/monitor" }
unbound-network = { path = "crates/libs/network" }
unbound-notifications = { path = "crates/shell/notifications" }
unbound-notify = { path = "crates/services/notify" }
unbound-polkit = { path = "crates/services/polkit" }
unbound-power = { path = "crates/services/power" }
unbound-preview = { path = "crates/libs/preview" }
unbound-protocols = { path = "crates/platform/protocols" }
unbound-render = { path = "crates/platform/render" }
unbound-review = { path = "crates/testing/review" }
unbound-sample = { path = "crates/testing/sample" }
unbound-screenshot = { path = "crates/shell/screenshot" }
unbound-search = { path = "crates/libs/search" }
unbound-settings = { path = "crates/apps/settings" }
unbound-settings-panes = { path = "crates/libs/settings-panes" }
unbound-shell = { path = "crates/shell/shell" }
unbound-sound = { path = "crates/services/sound", default-features = false }
unbound-spring = { path = "crates/libs/spring" }
unbound-status = { path = "crates/libs/status" }
unbound-term = { path = "crates/apps/terminal" }
unbound-test-bus = { path = "crates/testing/test-bus" }
unbound-test-wayland = { path = "crates/testing/test-wayland" }
unbound-thumbnails = { path = "crates/libs/thumbnails" }
unbound-toolkit = { path = "crates/toolkit/toolkit" }
unbound-toolkit-platform = { path = "crates/toolkit/platform" }
unbound-tray = { path = "crates/services/tray" }
unbound-volumes = { path = "crates/libs/volumes" }
unbound-wallpaper = { path = "crates/libs/wallpaper" }
unbound-watch = { path = "crates/libs/watch" }
unbound-widgets = { path = "crates/toolkit/widgets" }
unbound-xdg = { path = "crates/libs/xdg" }
xdg-desktop-portal-unbound = { path = "crates/services/portal" }

[profile.dev]
debug = "line-tables-only"

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
