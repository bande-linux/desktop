name: release
run-name: "${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Unpublished build of {0}', github.ref_name) }}"

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always

jobs:
  suites:
    uses: bande-linux/apt/.github/workflows/suites.yml@main

  lint:
    needs: suites
    runs-on: ubuntu-24.04-arm
    container: debian:${{ fromJSON(needs.suites.outputs.list)[0] }}
    timeout-minutes: 60
    steps:
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
      - run: ci/release/verify.sh --setup lint
      - uses: Swatinem/rust-cache@v2
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ci/release/verify.sh lint

  test:
    name: test (${{ matrix.suite }})
    needs: suites
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.list) }}
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:${{ matrix.suite }}
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
    timeout-minutes: 120
    steps:
      - name: Free disk space on the host
        run: rm -rf /host/dotnet/* /host/android/* /host/ghc/* && df -h /
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
      - run: ci/release/verify.sh --setup test
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-${{ matrix.suite }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: ci/release/verify.sh test

  source:
    needs: suites
    runs-on: ubuntu-24.04
    container: debian:${{ fromJSON(needs.suites.outputs.list)[0] }}
    timeout-minutes: 30
    steps:
      - name: Install the tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates cargo dpkg-dev jq python3 xz-utils distro-info-data
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check that the tagged commit is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check that the tag, Cargo.toml and debian/changelog agree
        run: ci/deb/version.sh
      - run: ci/deb/source.sh source
      - name: Check that debian/copyright and the librust Build-Depends follow Cargo.lock
        run: |
          ci/copyright.py --check
          ci/deb/build-depends.py --check
      - uses: actions/upload-artifact@v7
        with:
          name: bande-source
          path: |
            source/*.dsc
            source/*.tar.xz
          if-no-files-found: error

  debs:
    name: debs (${{ matrix.suite }}, ${{ matrix.arch }})
    needs: [suites, source]
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.list) }}
        arch: [arm64, amd64]
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            build: --build=any
          - arch: amd64
            runner: ubuntu-24.04
            build: --build=binary
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:${{ matrix.suite }}
      volumes:
        - /usr/share/dotnet:/host/dotnet
        - /usr/local/lib/android:/host/android
        - /opt/ghc:/host/ghc
    timeout-minutes: 240
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/deb
      DEB_BUILD_OPTIONS: nocheck parallel=2
    steps:
      - name: Free disk space on the host
        run: rm -rf /host/dotnet/* /host/android/* /host/ghc/* && df -h /
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
      - run: ci/release/verify.sh --setup debs
      - uses: actions/download-artifact@v7
        with:
          name: bande-source
          path: source
      - uses: Swatinem/rust-cache@v2
        with:
          key: debs-${{ matrix.suite }}-${{ matrix.arch }}
          cache-targets: false
          cache-directories: target/deb
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the packages offline from the source package
        run: ci/deb/build.sh source/*.dsc debs ${{ matrix.build }}
      - name: Disk and memory after the build
        if: always()
        run: df -h / && grep -E "MemTotal|MemAvailable" /proc/meminfo
      - name: Check the packages
        run: ci/release/check-debs.sh debs
      - name: Lintian
        run: |
          chmod 755 debs source
          chmod 644 debs/* source/*
          runuser -u nobody -- lintian --fail-on error,warning debs/*.changes source/*.dsc
      - uses: actions/upload-artifact@v7
        with:
          name: bande-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: |
            debs/*_${{ matrix.arch }}.deb
            !debs/*-dbgsym_*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: matrix.arch == 'amd64'
        with:
          name: bande-debs-${{ matrix.suite }}-all
          path: debs/*_all.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: bande-debug-symbols-${{ matrix.suite }}-${{ matrix.arch }}
          path: debs/*-dbgsym_*.deb
          if-no-files-found: error

  install:
    name: install (${{ matrix.suite }}, ${{ matrix.arch }})
    needs: [suites, debs]
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.list) }}
        arch: [arm64, amd64]
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    container: debian:${{ matrix.suite }}
    timeout-minutes: 45
    steps:
      - name: Install autopkgtest
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends autopkgtest dpkg-dev
      - uses: actions/download-artifact@v7
        with:
          name: bande-source
          path: source
      - uses: actions/download-artifact@v7
        with:
          name: bande-debs-${{ matrix.suite }}-${{ matrix.arch }}
          path: debs
      - uses: actions/download-artifact@v7
        with:
          name: bande-debs-${{ matrix.suite }}-all
          path: debs
      - name: Run the autopkgtests on this throwaway Debian ${{ matrix.suite }}
        run: |
          test "$(dpkg --print-architecture)" = "${{ matrix.arch }}"
          autopkgtest --no-built-binaries source/*.dsc debs/*.deb -- null

  release-source:
    if: github.ref_type == 'tag'
    needs: [suites, install]
    runs-on: ubuntu-24.04
    container: debian:${{ fromJSON(needs.suites.outputs.list)[0] }}
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Install gh
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends gh ca-certificates
      - uses: actions/download-artifact@v7
        with:
          name: bande-source
          path: source
      - name: Attach the source package to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes "" source/*
