[package]
name = "bande-compositor"
description = "Bande Wayland compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
accesskit_unix.workspace = true
jiff.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["net", "time"] }
smithay = { workspace = true, features = ["backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "desktop"] }
tracing.workspace = true
bande-bus.workspace = true
bande-config.workspace = true
bande-datetime.workspace = true
bande-edid.workspace = true
bande-graphics.workspace = true
bande-l10n.workspace = true
bande-log.workspace = true
bande-protocols = { workspace = true, features = ["server"] }
bande-render.workspace = true
bande-spring.workspace = true
bande-widgets.workspace = true
bande-xdg.workspace = true
zbus.workspace = true

[dev-dependencies]
bande-test-bus.workspace = true
bande-test-wayland.workspace = true
wayland-client.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, libvulkan1, mesa-vulkan-drivers | vulkan-icd, systemd"
recommends = "bande-clipboard, bande-shell, bande-lock, bande-screenshot, bande-files, bande-settings"
suggests = "fcitx5"
extended-description = """\
Wayland compositor for the Bande desktop session, built on Smithay. It runs \
on a logind seat, drives the displays through DRM/KMS, reads input through \
libinput and composes windows with its own Vulkan renderer, scanning \
full-screen clients out directly when it can."""
assets = [
    ["target/release/bande-compositor", "usr/bin/", "755"],
    ["data/bande-session", "usr/bin/", "755"],
    ["data/bande-compositor.service", "usr/lib/systemd/user/", "644"],
    ["data/bande-session.target", "usr/lib/systemd/user/", "644"],
    ["data/bande.desktop", "usr/share/wayland-sessions/", "644"],
    ["data/session-clients", "usr/share/bande-compositor/", "644"],
]

[lints]
workspace = true
