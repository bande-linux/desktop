[package]
name = "bande-automount"
description = "Bande removable media mounting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
async-io.workspace = true
blocking.workspace = true
serde_json.workspace = true
udev.workspace = true
rustix = { workspace = true, features = ["event", "fs", "mount", "net", "process"] }
tracing.workspace = true
bande-bus.workspace = true
bande-fs.workspace = true
bande-keyring.workspace = true
bande-l10n.workspace = true
bande-log.workspace = true
bande-notify.workspace = true
bande-packages.workspace = true
bande-volumes.workspace = true
bande-xdg.workspace = true
zbus.workspace = true

[dev-dependencies]
bande-test-bus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, default-dbus-session-bus | dbus-session-bus, init-system-helpers (>= 1.66), udisks2, pkexec"
recommends = "cifs-utils, smbclient, sshfs, davfs2, go-mtpfs, gphotofs, libmtp-common, fuse3, systemd-resolved"
extended-description = """\
Mounts removable drives through UDisks2 as they appear, connects to SMB, \
SFTP and WebDAV servers as ordinary mounts with passwords in the keychain, \
mounts phones and cameras, warns when a mounted drive is disconnected without being ejected, and warns once when \
the startup disk or the home folder runs out of space. Started with the \
graphical session."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/bande-automount", "usr/bin/", "755"],
    ["target/release/bande-mount-helper", "usr/libexec/", "755"],
    ["data/bande-automount.service", "usr/lib/systemd/user/", "644"],
    ["data/org.bande.Mounts.service", "usr/share/dbus-1/services/", "644"],
    ["data/org.bande.mount-helper.policy", "usr/share/polkit-1/actions/", "644"],
    ["data/bande-davfs2.conf", "usr/share/bande/", "644"],
    ["data/bande-mount-cleanup.conf", "usr/lib/systemd/system/user-runtime-dir@.service.d/", "644"],
    ["data/bande-mdns.conf", "usr/lib/systemd/resolved.conf.d/", "644"],
    ["data/bande-mdns-networkmanager.conf", "usr/lib/NetworkManager/conf.d/", "644"],
    ["target/release/l10n/development/bande-automount/*", "usr/share/bande/l10n/bande-automount/", "644"],
    ["target/release/l10n/development/bande-mount-helper/*", "usr/share/bande/l10n/bande-mount-helper/", "644"],
]

[lints]
workspace = true
