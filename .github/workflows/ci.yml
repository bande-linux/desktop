name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

jobs:
  lint:
    name: ci/lint
    runs-on: [self-hosted, unbound]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: ci/target-dir.sh
      - name: Install build dependencies
        run: ci/apt-install.sh pkg-config libxkbcommon-dev libgbm-dev libinput-dev libseat-dev libudev-dev libpipewire-0.3-dev libclang-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Keep services off the widget crates and graphics and widgets off Wayland
        run: |
          forbid() {
            if cargo tree --locked --manifest-path "$1" --edges normal --prefix none | grep -E "^($2) "; then
              echo "$1 must not depend on the crates above"
              exit 1
            fi
          }
          for manifest in crates/services/*/Cargo.toml; do
            forbid "$manifest" 'unbound-widgets|unbound-toolkit|unbound-toolkit-platform'
          done
          for manifest in crates/toolkit/graphics/Cargo.toml crates/toolkit/widgets/Cargo.toml; do
            forbid "$manifest" 'wayland-[a-z-]+|unbound-toolkit-platform'
          done

  test:
    name: ci/lavapipe-test
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/')
    runs-on: [self-hosted, unbound]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: ci/target-dir.sh
      - name: Install build and test dependencies
        run: ci/apt-install.sh pkg-config libxkbcommon-dev libgbm-dev libinput-dev libseat-dev libudev-dev libpipewire-0.3-dev libclang-dev libvulkan1 mesa-vulkan-drivers dbus-daemon at-spi2-core libfontconfig1 libwayland-client0
      - name: Install Debian 13's fonts, which the goldens are rendered with
        run: ci/debian-fonts.sh
      - name: Install kill for the clipboard daemon's restart test
        run: ci/apt-install.sh procps
      - run: cargo test --workspace --locked -- --show-output
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rendered-frames
          path: target/tmp/*.png
          if-no-files-found: ignore

  deb:
    name: ci/deb
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/')
    runs-on: [self-hosted, unbound]
    timeout-minutes: 90
    env:
      CARGO_DEB_VERSION: 3.8.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - run: ci/target-dir.sh
      - name: Install build and smoke-test dependencies
        run: ci/apt-install.sh pkg-config libxkbcommon-dev libgbm-dev libinput-dev libseat-dev libudev-dev libvulkan1 mesa-vulkan-drivers dbus-daemon dbus-bin
      - name: Install cargo-deb
        run: |
          cargo deb --version 2>/dev/null | grep -qw "$CARGO_DEB_VERSION" && exit 0
          root=/cache/tools/cargo-deb-$CARGO_DEB_VERSION
          test -x "$root/bin/cargo-deb" \
            || cargo install cargo-deb --version "$CARGO_DEB_VERSION" --locked --root "$root"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: Derive the package version from git
        run: |
          ci/deb/version-test.sh
          version=$(ci/deb/version.sh)
          echo "Package version $version"
          echo "DEB_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the packages
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build --remap-path-prefix=/root/.cargo=/cargo --remap-path-prefix=/root/.rustup=/rustup
        run: |
          packages="unbound-compositor unbound-notify unbound-clipboard unbound-config unbound-power unbound-sound \
              xdg-desktop-portal-unbound unbound-file-chooser unbound-tray unbound-automount \
              unbound-shell unbound-term unbound-lock unbound-screenshot unbound-files unbound-settings unbound-greeter unbound-monitor"
          cargo build --profile dist --locked $(printf -- '--package %s ' $packages)
          for package in $packages; do
            cargo deb --profile dist --no-build --package "$package" --locked --deb-version "$DEB_VERSION"
          done
      - name: Build the benchmarks for ci/perf against the packaged release build
        if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[perf]')
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build --remap-path-prefix=/root/.cargo=/cargo --remap-path-prefix=/root/.rustup=/rustup
        run: cargo build --profile dist --locked --package unbound-bench --package unbound-sample
      - uses: actions/upload-artifact@v7
        if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[perf]')
        with:
          name: perf-binaries
          path: |
            target/dist/unbound-compositor
            target/dist/unbound-bench
            target/dist/unbound-toolkit-bench
            target/dist/unbound-sample
          if-no-files-found: error
      - name: Inspect the packages
        run: |
          for deb in target/debian/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
            test "$(dpkg-deb --field "$deb" Architecture)" = arm64
            test "$(dpkg-deb --field "$deb" Version)" = "$DEB_VERSION"
            test "$(dpkg-deb --field "$deb" Section)" = misc
            ! dpkg-deb --fsys-tarfile "$deb" | tar -xO | grep -aq -e "$GITHUB_WORKSPACE" -e /root/.cargo
          done
          dpkg-deb --field target/debian/unbound-compositor_*.deb Depends \
            | grep -F 'mesa-vulkan-drivers | vulkan-icd'
      - name: Check that the notification daemon is D-Bus activatable
        run: |
          root=$(mktemp -d)
          dpkg-deb --extract target/debian/unbound-notify_*.deb "$root"
          service="$root/usr/share/dbus-1/services/org.unbound.Notify.service"
          grep -qx 'Name=org.freedesktop.Notifications' "$service"
          test -x "$root$(sed -n 's/^Exec=//p' "$service")"
      - name: Check the clipboard daemon's package
        run: |
          deb=$(ls target/debian/unbound-clipboard_*.deb)
          dpkg-deb --contents "$deb" | grep -q ' ./usr/bin/unbound-clipboard$'
          dpkg-deb --field target/debian/unbound-compositor_*.deb Recommends \
            | grep -qw 'unbound-clipboard'
      - name: Check the shell's packages
        run: |
          for package in unbound-shell unbound-term unbound-lock unbound-screenshot unbound-files unbound-settings; do
            dpkg-deb --field target/debian/unbound-compositor_*.deb Recommends | grep -q "$package"
            dpkg-deb --contents target/debian/"$package"_*.deb | grep -q " ./usr/bin/$package\$"
          done
          for variant in light dark; do
            dpkg-deb --contents target/debian/unbound-shell_*.deb \
              | grep -q " ./usr/share/unbound/wallpapers/drift-$variant.svg\$"
          done
          root=$(mktemp -d)
          dpkg-deb --extract target/debian/unbound-term_*.deb "$root"
          grep -qx 'Exec=unbound-term' "$root/usr/share/applications/org.unbound.Terminal.desktop"
          grep -qx 'Icon=org.unbound.Terminal' "$root/usr/share/applications/org.unbound.Terminal.desktop"
          test -s "$root/usr/share/icons/hicolor/scalable/apps/org.unbound.Terminal.svg"
          dpkg-deb --extract target/debian/unbound-files_*.deb "$root"
          grep -qx 'Exec=unbound-files' "$root/usr/share/applications/org.unbound.Files.desktop"
          test -s "$root/usr/share/icons/hicolor/scalable/apps/org.unbound.Files.svg"
          dpkg-deb --extract target/debian/unbound-settings_*.deb "$root"
          grep -qx 'Exec=unbound-settings' "$root/usr/share/applications/org.unbound.Settings.desktop"
          dpkg-deb --extract target/debian/unbound-monitor_*.deb "$root"
          test -x "$root/usr/bin/unbound-monitor"
          grep -qx 'Exec=unbound-monitor' "$root/usr/share/applications/org.unbound.ActivityMonitor.desktop"
          dpkg-deb --extract target/debian/unbound-greeter_*.deb "$root"
          grep -qx 'command = "/usr/bin/unbound-compositor --greeter"' "$root/usr/share/unbound-greeter/greetd-config.toml"
          dpkg-deb --field target/debian/unbound-greeter_*.deb Depends | grep -qw greetd
          dpkg-deb --extract target/debian/unbound-lock_*.deb "$root"
          grep -qx '@include common-auth' "$root/etc/pam.d/unbound-lock"
          dpkg-deb --field target/debian/unbound-lock_*.deb Depends | grep -q libpam0g
      - name: Check the session services' user units and D-Bus activation
        run: |
          for entry in unbound-config:org.unbound.Config:org.unbound.Config \
              unbound-power:org.unbound.Power:org.freedesktop.ScreenSaver \
              unbound-sound:org.unbound.Sound:org.unbound.Sound \
              unbound-tray:org.unbound.Tray:org.kde.StatusNotifierWatcher; do
            IFS=: read -r package file name <<< "$entry"
            deb=$(ls target/debian/"$package"_*.deb)
            root=$(mktemp -d)
            dpkg-deb --extract "$deb" "$root"
            service="$root/usr/share/dbus-1/services/$file.service"
            unit="$root/usr/lib/systemd/user/$package.service"
            grep -qx "Name=$name" "$service"
            grep -qx "SystemdService=$package.service" "$service"
            grep -qx "BusName=$name" "$unit"
            grep -qx 'WantedBy=unbound-session.target' "$unit"
            test -x "$root$(sed -n 's/^Exec=//p' "$service")"
            test -x "$root$(sed -n 's/^ExecStart=//p' "$unit")"
            dpkg-deb --ctrl-tarfile "$deb" | tar -t | grep -qx './postinst'
          done
      - name: Check the automount service's user unit
        run: |
          deb=$(ls target/debian/unbound-automount_*.deb)
          root=$(mktemp -d)
          dpkg-deb --extract "$deb" "$root"
          unit="$root/usr/lib/systemd/user/unbound-automount.service"
          grep -qx 'WantedBy=unbound-session.target' "$unit"
          test -x "$root$(sed -n 's/^ExecStart=//p' "$unit")"
          dpkg-deb --field "$deb" Depends | grep -q 'udisks2'
      - name: Check the login session
        run: |
          ci/apt-install.sh systemd dbus-user-session
          root=$(mktemp -d)
          for deb in target/debian/unbound-{compositor,config,power,tray,automount}_*.deb; do
            dpkg-deb --extract "$deb" "$root"
          done
          session="$root/usr/share/wayland-sessions/unbound.desktop"
          grep -qx 'Type=Application' "$session"
          grep -qx 'Name=Unbound' "$session"
          grep -qx 'Exec=unbound-session' "$session"
          grep -qx 'DesktopNames=Unbound' "$session"
          test -x "$root/usr/bin/unbound-session"
          sh -n "$root/usr/bin/unbound-session"
          units=$(mktemp -d)
          cp "$root"/usr/lib/systemd/user/* "$units/"
          sed -i "s|^ExecStart=/|ExecStart=$root/|" "$units"/*
          grep -qx 'Type=notify' "$units/unbound-compositor.service"
          grep -qx 'BindsTo=graphical-session.target' "$units/unbound-compositor.service"
          grep -qx 'Wants=xdg-desktop-autostart.target' "$units/unbound-session.target"
          ! grep -l 'WantedBy=graphical-session.target' "$units"/*
          export XDG_RUNTIME_DIR=$(mktemp -d)
          findings=$(cd "$units" && SYSTEMD_LOG_LEVEL=warning systemd-analyze --user verify ./* 2>&1) || true
          echo "$findings"
          test -z "$findings"
      - name: Check the portal backend's registration
        run: |
          root=$(mktemp -d)
          dpkg-deb --extract target/debian/xdg-desktop-portal-unbound_*.deb "$root"
          portal="$root/usr/share/xdg-desktop-portal/portals/unbound.portal"
          service="$root/usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.unbound.service"
          grep -qx 'DBusName=org.freedesktop.impl.portal.desktop.unbound' "$portal"
          grep -qx 'Name=org.freedesktop.impl.portal.desktop.unbound' "$service"
          test -x "$root$(sed -n 's/^Exec=//p' "$service")"
          grep -q '^org.freedesktop.impl.portal.Settings=unbound;' \
            "$root/usr/share/xdg-desktop-portal/unbound-portals.conf"
      - name: Smoke-test the packaged settings service
        run: |
          root=$(mktemp -d)
          dpkg-deb --extract target/debian/unbound-config_*.deb "$root"
          export XDG_CONFIG_HOME=$(mktemp -d)
          mkdir -p "$XDG_CONFIG_HOME/unbound"
          echo 'bar { edge "top"; }' > "$XDG_CONFIG_HOME/unbound/config.kdl"
          dbus-run-session -- bash -c '
            "$1/usr/bin/unbound-config" &
            daemon=$!
            for attempt in $(seq 50); do
              reply=$(dbus-send --session --print-reply --dest=org.unbound.Config /org/unbound/Config \
                org.freedesktop.DBus.Properties.Get string:org.unbound.Config string:BarEdge 2>/dev/null) \
                && break
              sleep 0.1
            done
            kill "$daemon"
            echo "$reply"
            grep -q "string \"top\"" <<< "$reply"
          ' bash "$root"
      - name: Smoke-test the packaged compositor
        run: |
          root=$(mktemp -d)
          dpkg-deb --extract target/debian/unbound-compositor_*.deb "$root"
          export XDG_RUNTIME_DIR=$(mktemp -d)
          status=0
          timeout 10 "$root/usr/bin/unbound-compositor" --headless > "$root/stdout" || status=$?
          cat "$root/stdout"
          test "$status" = 124
          grep -q '^WAYLAND_DISPLAY=wayland-' "$root/stdout"
      - uses: actions/upload-artifact@v7
        with:
          name: unbound-debs-arm64
          path: target/debian/*.deb
          if-no-files-found: error

  deb-all:
    name: ci/deb-all
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/')
    runs-on: [self-hosted, unbound]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install the packaging tools
        run: ci/apt-install.sh build-essential debhelper dpkg-dev lintian gnupg
      - name: Build the repository and meta packages
        run: |
          version=$(ci/deb/version.sh)
          (cd packaging/unbound-apt-source && dpkg-buildpackage -b -us -uc)
          (cd packaging/unbound-desktop && DEB_VERSION_OVERRIDE=$version dpkg-buildpackage -b -us -uc)
          mkdir -p debs
          mv packaging/*.deb debs/
          ls -l debs
          test "$(dpkg-deb --field debs/unbound-desktop_*_all.deb Version)" = "$version"
          dpkg-deb --field debs/unbound-desktop_*_all.deb Depends | grep -qF "unbound-compositor (= $version)"
          dpkg-deb --field debs/unbound-desktop_*_all.deb Recommends | grep -qF "unbound-monitor (= $version)"
          root=$(mktemp -d)
          dpkg-deb --extract debs/unbound-desktop_*_all.deb "$root"
          grep -qx 'application/pdf=org.gnome.Papers.desktop;' "$root/usr/share/applications/unbound-mimeapps.list"
      - name: Lint the packages
        run: |
          chmod -R a+rX debs
          sudo -u nobody lintian --fail-on error,warning debs/*.deb
      - name: Check the repository packages
        run: |
          root=$(mktemp -d)
          for channel in unbound-apt-source:trixie unbound-apt-source-testing:trixie-testing; do
            IFS=: read -r package suite <<< "$channel"
            dpkg-deb --extract debs/"$package"_*_all.deb "$root/$package"
            sed "s/^Suites: .*/Suites: SUITE/" "$root/$package/etc/apt/sources.list.d/unbound.sources" > "$root/$package.sources"
            grep -qx "Suites: $suite" "$root/$package/etc/apt/sources.list.d/unbound.sources"
          done
          cmp "$root/unbound-apt-source.sources" "$root/unbound-apt-source-testing.sources"
          dpkg-deb --extract debs/unbound-archive-keyring_*_all.deb "$root/keyring"
          gpg --batch --with-colons --show-keys "$root/keyring/usr/share/keyrings/unbound-archive-keyring.pgp" \
            | grep -qx 'fpr:::::::::6287DE66459929AA1C01E146495A6C1982647E05:'
      - uses: actions/upload-artifact@v7
        with:
          name: unbound-debs-all
          path: debs/*.deb
          if-no-files-found: error

  deb-install:
    name: ci/deb-install
    needs: [deb, deb-all]
    runs-on: [self-hosted, unbound]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: unbound-debs-*
          path: ci/deb/install-test/debs
          merge-multiple: true
      - name: Install unbound-desktop into a clean Debian 13
        run: |
          image=unbound-install-test:${{ github.sha }}
          docker build --quiet --tag "$image" ci/deb/install-test
          trap 'docker rmi --force "$image" >/dev/null' EXIT
          docker run --rm "$image"

  vm:
    name: ci/vm
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/')
    runs-on: [self-hosted, unbound-kvm]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: ci/target-dir.sh
      - name: Install build and guest dependencies
        run: ci/apt-install.sh pkg-config libxkbcommon-dev libgbm-dev libinput-dev libseat-dev libudev-dev libpipewire-0.3-dev libclang-dev jq e2fsprogs qemu-system-arm
      - name: Build or reuse the guest kernel and root image
        run: ci/vm/images.sh vm
      - name: Run the guest tests in a KVM guest with vkms and virtio-gpu
        env:
          GUEST_TIMEOUT: '2700'
        run: ci/vm/guest-tests.sh vm
      - name: Sign in through greetd, PAM and logind in a guest booted with systemd
        continue-on-error: true
        run: ci/vm/login-test.sh vm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screendumps
          path: screendumps/*.png
          if-no-files-found: ignore

  polkit:
    name: ci/polkit
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/ci/')
    runs-on: [self-hosted, unbound]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: ci/target-dir.sh
      - name: Build the polkitd test
        run: |
          cargo test --package unbound-polkit --test polkitd --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "polkitd") | .executable // empty' \
            > polkitd-test-path
          test -s polkitd-test-path
      - name: Authenticate through the agent against polkitd on Debian 13
        run: |
          image=unbound-polkit-test:${{ github.sha }}
          docker build --quiet --tag "$image" crates/services/polkit/tests/polkitd
          container=$(docker create "$image")
          trap 'docker rm --force "$container" >/dev/null; docker rmi "$image" >/dev/null' EXIT
          docker cp "$(cat polkitd-test-path)" "$container:/polkitd-test"
          docker start --attach "$container"

  portal:
    name: ci/portal
    needs: [deb]
    runs-on: [self-hosted, unbound]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: unbound-debs-arm64
          path: portal-test
      - name: Read the colour scheme through xdg-desktop-portal on Debian 13
        run: |
          cp crates/services/portal/tests/frontend/* portal-test/
          image=unbound-portal-test:${{ github.sha }}
          docker build --quiet --tag "$image" portal-test
          trap 'docker rmi --force "$image" >/dev/null' EXIT
          docker run --rm "$image"

  perf:
    name: ci/perf
    needs: [test, deb, vm]
    if: github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[perf]')
    runs-on: [self-hosted, unbound]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the runtime dependencies
        run: ci/apt-install.sh libvulkan1 mesa-vulkan-drivers fonts-inter fonts-manrope fonts-jetbrains-mono libfontconfig1 libwayland-client0
      - uses: actions/download-artifact@v7
        with:
          name: perf-binaries
          path: target/release
      - run: chmod +x target/release/unbound-*
      - name: Measure against the budgets in docs/decisions/0001-rendering.md
        shell: bash
        run: |
          target/release/unbound-bench \
            --compositor target/release/unbound-compositor --json perf.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf
          path: perf.json
          if-no-files-found: ignore
      - name: Measure the toolkit sample against the budgets in docs/decisions/0001-rendering.md
        shell: bash
        run: |
          target/release/unbound-toolkit-bench \
            --sample target/release/unbound-sample --json perf-toolkit.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-toolkit
          path: perf-toolkit.json
          if-no-files-found: ignore

  publish:
    name: ci/publish
    needs: [lint, test, deb, deb-all, deb-install, vm, polkit, portal, perf]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref_type == 'tag')
    runs-on: [self-hosted, unbound]
    timeout-minutes: 10
    steps:
      - name: Token for the apt repository
        id: token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APT_TRIGGER_CLIENT_ID }}
          private-key: ${{ secrets.APT_TRIGGER_KEY }}
          owner: unbound-linux
          repositories: apt
          permission-actions: write
      - name: Start the publish in unbound-linux/apt
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          RUN_ID: ${{ github.run_id }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          jq -n --arg run "$RUN_ID" --arg tag "$TAG" '{ref: "main", inputs: {run_id: $run, tag: $tag}}' |
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              https://api.github.com/repos/unbound-linux/apt/actions/workflows/publish.yml/dispatches --data @-
          echo "Started publishing run $RUN_ID${TAG:+ as $TAG}"

  alert:
    name: ci/alert
    needs: [lint, test, deb, deb-all, deb-install, vm, polkit, portal, perf, publish]
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, unbound]
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: Open, update or close the "CI is red on main" issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/red-main.sh
