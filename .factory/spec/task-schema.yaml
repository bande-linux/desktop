$schema: "http://json-schema.org/draft-07/schema#"
title: UnboundFactoryTask
type: object
required:
  - id
  - title
  - repository
  - priority
  - component
  - dependencies
  - acceptance_criteria
properties:
  id:
    type: string
    pattern: "^task-[0-9]{3,}$"
    description: "Unique deterministic identifier, e.g. task-001"
  title:
    type: string
    description: "Imperative task description"
  repository:
    type: string
    enum:
      - desktop
      - compositor
      - shell
      - greeter
      - portal
      - toolkit
      - apps
      - factory
      - infrastructure
  priority:
    type: string
    enum: [P0, P1, P2, P3]
    description: "P0 (Critical/Blocker), P1 (High), P2 (Medium), P3 (Low)"
  component:
    type: string
    description: "Crate or subsystem name (e.g. unbound-toolkit, smithay-drm)"
  dependencies:
    type: array
    items:
      type: string
    description: "Task IDs that must reach VERIFIED_COMPLETE before this task is ready"
  claimed_by:
    type: [string, "null"]
    description: "Active agent lease identifier or null"
  lease_expires_at:
    type: [string, "null"]
    format: date-time
    description: "Heartbeat expiry timestamp"
  session_reuse_compatible:
    type: boolean
    default: true
    description: "Whether this task can reuse an active warm agent worktree session"
  acceptance_criteria:
    type: array
    items:
      type: string
    description: "Verifiable invariants and test requirements"
  verification_tier:
    type: integer
    minimum: 0
    maximum: 5
    default: 3
    description: "Minimum verification funnel tier required before PR submission"
