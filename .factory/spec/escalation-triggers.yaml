version: "1.0"
description: "Deterministic Human-in-the-Loop escalation circuit breaker rules"
escalation_triggers:
  - id: cyclic_regression
    name: "Cyclic Regression / Review Churn"
    threshold: 3
    unit: "failed review or CI cycles"
    description: "Worker agent failed pre-PR review or CI 3 consecutive times with repetitive diff hunks"
    action: "revert_to_base_and_quarantine"
    notification: "github_issue_comment_with_incident_brief"

  - id: resource_bounds
    name: "Token or Wall-Clock Budget Exceeded"
    thresholds:
      max_tokens: 500000
      max_duration_seconds: 2700 # 45 minutes
    description: "Per-task token spend or execution duration exceeded upper ceiling"
    action: "freeze_and_terminate_subprocesses"
    notification: "github_issue_comment_with_incident_brief"

  - id: blast_radius_violation
    name: "Blast Radius Sandbox Violation"
    protected_paths:
      - "Cargo.toml" # Workspace root
      - ".github/workflows/**"
      - "infrastructure/**"
    description: "Agent attempted modifying files outside declared component scope"
    action: "abort_transaction_and_quarantine"
    notification: "security_alert_and_human_review"

  - id: security_boundary
    name: "Privileged / Security Subsystem Boundary"
    protected_modules:
      - "pam"
      - "polkit"
      - "session_lock"
      - "crypto"
      - "drm_master"
    description: "Code modifications touch PAM authentication or polkit privilege escalation"
    action: "require_mandatory_human_signoff"
    notification: "github_pr_security_review_required"

  - id: specification_ambiguity
    name: "Contradictory Requirements or Low Model Confidence"
    confidence_threshold: 0.70
    description: "Requirements conflict with ARCHITECTURE.md or model confidence is below threshold"
    action: "pause_branch_and_generate_rfc"
    notification: "github_issue_clarification_rfc"

  - id: semantic_merge_conflict
    name: "Non-Trivial Rebase Conflict on Trunk"
    description: "Rebasing worktree onto latest main tip resulted in semantic structural merge conflict"
    action: "lock_worktree_and_escalate"
    notification: "github_issue_conflict_brief"
