[package]
name = "bande-greeter"
description = "Bande login window: signs users in through greetd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
bande-config.workspace = true
bande-datetime.workspace = true
bande-keyboard.workspace = true
bande-l10n.workspace = true
bande-lock.workspace = true
bande-log.workspace = true
bande-status.workspace = true
bande-toolkit.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter, greetd (>= 0.10.3-6), bande-compositor"
extended-description = """\
The login window of the Bande desktop: greetd runs it as its greeter \
inside bande-compositor --greeter, and it lists the people who can \
sign in, asks for the chosen person's password and has greetd start \
their Bande session. It becomes greetd's greeter through a drop-in for \
greetd.service; greetd itself asks which display manager to start when \
another one is installed."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/bande-greeter", "usr/bin/", "755"],
    ["data/config.toml", "usr/share/bande-greeter/greetd-config.toml", "644"],
    ["data/greetd.service.conf", "usr/lib/systemd/system/greetd.service.d/bande.conf", "644"],
]

[lints]
workspace = true
