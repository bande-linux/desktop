[package]
name = "unbound-tray"
description = "Unbound StatusNotifierWatcher for tray icons"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
zbus.workspace = true

[dev-dependencies]
unbound-test-bus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, dbus-session-bus | default-dbus-session-bus, init-system-helpers (>= 1.66)"
extended-description = """\
Serves org.kde.StatusNotifierWatcher, the registry through which \
applications such as Steam and Nextcloud publish tray icons and the \
Unbound menu bar finds them. Started with the graphical session."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/unbound-tray", "usr/bin/", "755"],
    ["data/unbound-tray.service", "usr/lib/systemd/user/", "644"],
    ["data/org.unbound.Tray.service", "usr/share/dbus-1/services/", "644"],
]

[lints]
workspace = true
