[workspace]
resolver = "3"
members = ["crates/*/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"
repository = "https://github.com/bande-linux/desktop"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
accesskit = "0.25.2"
accesskit_unix = "0.24.1"
alacritty_terminal = { version = "0.26.0", default-features = false }
ash = "0.38.0"
async-channel = "2.5.0"
async-executor = "1.14.0"
async-io = "2.6.0"
async-lock = "3.4.2"
async-process = "2.5.0"
base64 = "0.22.1"
blocking = "1.6.2"
bzip2 = "0.6.1"
data-encoding = "2.11"
encoding_rs = "0.8.35"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
flate2 = "1.1.10"
fontique = { version = "0.12.0", features = ["fontconfig-dlopen"] }
futures-lite = "2.6.1"
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-tag = "0.25.2"
gstreamer-video = "0.25.4"
hayro = "0.8.0"
html5ever = "0.40"
httparse = "1.10.1"
icu_calendar = "2.2"
icu_collator = "2.2"
icu_datetime = "2.2"
icu_decimal = "2.2"
icu_locale_core = "2.2"
image = { version = "0.25.10", default-features = false, features = ["gif", "jpeg", "png"] }
jiff = "0.2.37"
jxl-oxide = { version = "0.12.6", default-features = false }
kamadak-exif = "0.6.1"
kdl = { version = "6.7.1", default-features = false, features = ["span"] }
krilla = { version = "0.8.2", default-features = false, features = ["raster-images"] }
libc = "0.2.186"
libloading = "0.8.9"
lzma-rust2 = { version = "0.23", default-features = false, features = ["std", "xz", "encoder"] }
mailparse = "0.16"
md-5 = "0.10.6"
naga = { version = "30.0.1", features = ["wgsl-in", "spv-out"] }
oo7 = { version = "0.7.0-beta", default-features = false, features = ["async-std", "native_crypto", "unstable"] }
parley = { version = "0.12.0", features = ["complex-scripts"] }
pipewire = "0.10.1"
png = "0.18.1"
proc-macro2 = "1.0.107"
quick-xml = "0.38"
quote = "1.0.47"
raw-window-handle = "0.6.2"
regex = "1.13.1"
resvg = { version = "0.48", default-features = false }
ring = "0.17.14"
roxmltree = "0.21.2"
rusqlite = "0.40"
rustc-demangle = "0.1.28"
rustix = { version = "1.1.5", features = ["event", "param", "process"] }
rustls = { version = "0.23.46", default-features = false, features = ["logging", "ring", "std", "tls12"] }
rustls-platform-verifier = "0.6"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_norway = "0.9.42"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["aes256", "bzip2", "deflate", "ppmd"] }
sha2 = { version = "0.11.1", default-features = false }
skrifa = "0.44.0"
smithay = { version = "0.7.0", default-features = false, features = ["wayland_frontend"] }
spellbook = "0.4.2"
syn = "2.0.119"
tar = "0.4.46"
tempfile = "3.27.0"
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["ansi", "fmt", "registry", "std", "tracing-log"] }
udev = "0.9.3"
ureq = { version = "3.4.2", default-features = false, features = ["gzip", "platform-verifier", "rustls-no-provider"] }
vello_cpu = "0.3.0"
vello_gpu = { version = "0.3.0", default-features = false, features = ["wgpu", "text"] }
wayland-backend = { version = "0.3.17", features = ["log"] }
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-protocols-misc = { version = "0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-scanner = "0.31.11"
wayland-server = "0.31.14"
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
writeable = "0.6.4"
xkbcommon = "0.9"
zbus = "5.19.0"
zeroize = { version = "1.8.1", features = ["serde"] }
zip = { version = "9.1.3", default-features = false, features = ["aes-crypto", "bzip2", "deflate-flate2", "deflate64", "lzma"] }
bande-app = { path = "crates/libs/app" }
bande-app-menu = { path = "crates/libs/app-menu" }
bande-app-settings = { path = "crates/libs/app-settings" }
bande-audio = { path = "crates/libs/audio" }
