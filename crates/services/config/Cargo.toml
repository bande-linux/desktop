[package]
name = "bande-config"
description = "Bande KDL configuration"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
kdl.workspace = true
tracing.workspace = true
bande-bus.workspace = true
bande-design.workspace = true
bande-l10n.workspace = true
bande-log.workspace = true
bande-notify.workspace = true
bande-watch.workspace = true
zbus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, default-dbus-session-bus | dbus-session-bus, init-system-helpers (>= 1.66)"
recommends = "xdg-utils"
extended-description = """\
Serves ~/.config/bande/config.kdl as org.bande.Config on the session \
bus, applies changes to the file atomically, writes settings back without \
disturbing comments, and reports an invalid file as a notification with \
its line and column. Started with the graphical session or by D-Bus \
activation."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/bande-config", "usr/bin/", "755"],
    ["data/bande-config.service", "usr/lib/systemd/user/", "644"],
    ["data/org.bande.Config.service", "usr/share/dbus-1/services/", "644"],
]

[lints]
workspace = true
