[package]
name = "unbound-toolkit-platform"
description = "Unbound toolkit platform: Wayland windows, input, clipboard, run loop and accessibility"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
accesskit_unix.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
rustix = { workspace = true, features = ["fs", "pipe"] }
unbound-graphics.workspace = true
unbound-l10n.workspace = true
unbound-protocols = { workspace = true, features = ["client"] }
unbound-widgets.workspace = true
wayland-backend = { workspace = true, features = ["client_system", "dlopen"] }
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
wgpu.workspace = true
xkbcommon = { workspace = true, features = ["wayland"] }
zbus.workspace = true

[dev-dependencies]
image.workspace = true
image-compare.workspace = true
smithay.workspace = true
unbound-compositor.workspace = true
unbound-test-bus.workspace = true

[lints]
workspace = true
