[package]
name = "unbound-files"
description = "Unbound Files: browses folders in Miller columns with Quick Look"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
image.workspace = true
unbound-config.workspace = true
unbound-toolkit.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-dejavu-core, fonts-inter"
extended-description = """\
The file manager of the Unbound desktop: folders open in Miller columns \
driven by the arrow keys, as in the Finder's column view, and Space shows \
the selected file in Quick Look."""
assets = [
    ["target/release/unbound-files", "usr/bin/", "755"],
    ["data/unbound-files.desktop", "usr/share/applications/", "644"],
    ["data/unbound-files.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[lints]
workspace = true
