[package]
name = "unbound-launcher"
description = "Unbound launcher: finds and opens apps on Super+Space"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
tracing.workspace = true
unbound-config.workspace = true
unbound-log.workspace = true
unbound-toolkit.workspace = true
unbound-xdg.workspace = true

[dev-dependencies]
image.workspace = true
image-compare.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter"
extended-description = """\
The launcher of the Unbound desktop: Super+Space opens a search field \
over the screen that finds installed apps by name, description and \
keywords and opens the chosen one. unbound-compositor starts it and \
keeps it running so that it appears at once."""

[lints]
workspace = true
