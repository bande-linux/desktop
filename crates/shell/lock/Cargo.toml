[package]
name = "unbound-lock"
description = "Unbound lock screen: locks the session until the user's password is entered"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
jiff.workspace = true
libc.workspace = true
libloading.workspace = true
rustix.workspace = true
tracing.workspace = true
unbound-bar.workspace = true
unbound-datetime.workspace = true
unbound-inbox.workspace = true
unbound-keyboard.workspace = true
unbound-l10n.workspace = true
unbound-log.workspace = true
unbound-spring.workspace = true
unbound-status.workspace = true
unbound-toolkit.workspace = true
unbound-wallpaper.workspace = true
unbound-xdg.workspace = true
zbus.workspace = true

[dev-dependencies]
unbound-golden.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter, libpam0g, libpam-runtime"
recommends = "unbound-shell"
assets = [
    ["target/release/unbound-lock", "usr/bin/", "755"],
    ["data/unbound-lock.pam", "etc/pam.d/unbound-lock", "644"],
]
extended-description = """\
The lock screen of the Unbound desktop. Control-Super-Q, or the session \
going idle or to sleep, starts it; it covers every output through \
ext-session-lock-v1 and unlocks once PAM accepts the user's password."""

[lints]
workspace = true
