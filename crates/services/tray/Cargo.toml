[package]
name = "bande-tray"
description = "Bande StatusNotifierWatcher for tray icons"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
tracing.workspace = true
bande-bus.workspace = true
bande-log.workspace = true
zbus.workspace = true

[dev-dependencies]
bande-test-bus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, dbus-session-bus | default-dbus-session-bus, init-system-helpers (>= 1.66)"
extended-description = """\
Serves org.kde.StatusNotifierWatcher, the registry through which \
applications such as Steam and Nextcloud publish tray icons and the \
Bande menu bar finds them. Started with the graphical session."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/bande-tray", "usr/bin/", "755"],
    ["data/bande-tray.service", "usr/lib/systemd/user/", "644"],
    ["data/org.bande.Tray.service", "usr/share/dbus-1/services/", "644"],
]

[lints]
workspace = true
