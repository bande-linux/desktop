name: ci

on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

jobs:
  lint:
    name: ci/lint
    runs-on: [self-hosted, unbound]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libgbm-dev libinput-dev libseat-dev libudev-dev libpipewire-0.3-dev libclang-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: ci/lavapipe-test
    runs-on: [self-hosted, unbound]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libgbm-dev libinput-dev libseat-dev libudev-dev libpipewire-0.3-dev libclang-dev libvulkan1 mesa-vulkan-drivers fonts-dejavu-core dbus-daemon
      - name: Install the toolkit's fonts, fontconfig and libwayland-client
        run: |
          sudo apt-get install -y --no-install-recommends fonts-inter fonts-noto-cjk libfontconfig1 libwayland-client0
      - run: cargo test --workspace --locked -- --show-output
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rendered-frames
          path: target/tmp/*.png
          if-no-files-found: ignore

  deb:
    name: ci/deb
    runs-on: [self-hosted, unbound]
    timeout-minutes: 30
    env:
      CARGO_DEB_VERSION: 3.8.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: rustup toolchain install
      - name: Install build and smoke-test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libgbm-dev libinput-dev libseat-dev libudev-dev libvulkan1 mesa-vulkan-drivers dbus-daemon dbus-bin
      - name: Install cargo-deb
        run: |
          root=/cache/tools/cargo-deb-$CARGO_DEB_VERSION
          test -x "$root/bin/cargo-deb" \
            || cargo install cargo-deb --version "$CARGO_DEB_VERSION" --locked --root "$root"
          echo "$root/bin" >> "$GITHUB_PATH"
      - name: Derive the package version from git
        run: |
          ci/deb/version-test.sh
          version=$(ci/deb/version.sh)
          echo "Package version $version"
          echo "DEB_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build the packages
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build --remap-path-prefix=/root/.cargo=/cargo --remap-path-prefix=/root/.rustup=/rustup
        run: |
          for package in unbound-compositor unbound-notify unbound-clipboard unbound-config unbound-power \
              xdg-desktop-portal-unbound unbound-tray unbound-automount \
              unbound-panel unbound-launcher unbound-term unbound-lock unbound-screenshot unbound-files unbound-settings; do
            cargo deb --package "$package" --locked --deb-version "$DEB_VERSION"
          done
      - name: Inspect the packages
        run: |
          for deb in target/debian/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
            test "$(dpkg-deb --field "$deb" Architecture)" = arm64
            test "$(dpkg-deb --field "$deb" Version)" = "$DEB_VERSION"
            test "$(dpkg-deb --field "$deb" Section)" = misc
            ! dpkg-deb --fsys-tarfile "$deb" | tar -xO | grep -aq -e "$GITHUB_WORKSPACE" -e /root/.cargo
          done
          dpkg-deb --field target/debian/unbound-compositor_*.deb Depends \
            | grep -F 'mesa-vulkan-drivers | vulkan-icd'
      - name: Check that the notification daemon is D-Bus activatable
        run: |
          root=$(mktemp -d)
          dpkg-deb --extract target/debian/unbound-notify_*.deb "$root"
          service="$root/usr/share/dbus-1/services/org.unbound.Notify.service"
          grep -qx 'Name=org.freedesktop.Notifications' "$service"
          test -x "$root$(sed -n 's/^Exec=//p' "$service")"
      - name: Check the clipboard daemon's package
        run: |
          deb=$(ls target/debian/unbound-clipboard_*.deb)
          dpkg-deb --contents "$deb" | grep -q ' ./usr/bin/unbound-clipboard$'
          dpkg-deb --field target/debian/unbound-compositor_*.deb Recommends \
            | grep -qw 'unbound-clipboard'
      - name: Check the shell's packages
        run: |
          for package in unbound-panel unbound-launcher unbound-term unbound-lock unbound-screenshot unbound-files unbound-settings; do
            dpkg-deb --field target/debian/unbound-compositor_*.deb Recommends | grep -q "$package"
            dpkg-deb --contents target/debian/"$package"_*.deb | grep -q " ./usr/bin/$package\$"
          done
          root=$(mktemp -d)
          dpkg-deb --extract target/debian/unbound-term_*.deb "$root"
          grep -qx 'Exec=unbound-term' "$root/usr/share/applications/unbound-term.desktop"
          grep -qx 'Icon=unbound-term' "$root/usr/share/applications/unbound-term.desktop"
          test -s "$root/usr/share/icons/hicolor/scalable/apps/unbound-term.svg"
          dpkg-deb --extract target/debian/unbound-files_*.deb "$root"
          grep -qx 'Exec=unbound-files' "$root/usr/share/applications/unbound-files.desktop"
          test -s "$root/usr/share/icons/hicolor/scalable/apps/unbound-files.svg"
          dpkg-deb --extract target/debian/unbound-settings_*.deb "$root"
          grep -qx 'Exec=unbound-settings' "$root/usr/share/applications/unbound-settings.desktop"
          dpkg-deb --extract target/debian/unbound-lock_*.deb "$root"
          grep -qx '@include common-auth' "$root/etc/pam.d/unbound-lock"
          dpkg-deb --field target/debian/unbound-lock_*.deb Depends | grep -q libpam0g
      - name: Check the session services' user units and D-Bus activation
        run: |
          for entry in unbound-config:org.unbound.Config:org.unbound.Config \
              unbound-power:org.unbound.Power:org.freedesktop.ScreenSaver \
              unbound-tray:org.unbound.Tray:org.kde.StatusNotifierWatcher; do
            IFS=: read -r package file name <<< "$entry"
            deb=$(ls target/debian/"$package"_*.deb)
            root=$(mktemp -d)
            dpkg-deb --extract "$deb" "$root"
            service="$root/usr/share/dbus-1/services/$file.service"
            unit="$root/usr/lib/systemd/user/$package.service"
            grep -qx "Name=$name" "$service"
            grep -qx "SystemdService=$package.service" "$service"
            grep -qx "BusName=$name" "$unit"
            grep -qx 'WantedBy=unbound-session.target' "$unit"
            test -x "$root$(sed -n 's/^Exec=//p' "$service")"
            test -x "$root$(sed -n 's/^ExecStart=//p' "$unit")"
            dpkg-deb --ctrl-tarfile "$deb" | tar -t | grep -qx './postinst'
          done
      - name: Check the automount service's user unit
        run: |
          deb=$(ls target/debian/unbound-automount_*.deb)
          root=$(mktemp -d)
          dpkg-deb --extract "$deb" "$root"
          unit="$root/usr/lib/systemd/user/unbound-automount.service"
          grep -qx 'WantedBy=unbound-session.target' "$unit"
          test -x "$root$(sed -n 's/^ExecStart=//p' "$unit")"
          dpkg-deb --field "$deb" Depends | grep -q 'udisks2'
      - name: Check the login session
        run: |
          sudo apt-get install -y --no-install-recommends systemd dbus-user-session
          root=$(mktemp -d)
          for deb in target/debian/unbound-{compositor,config,power,tray,automount}_*.deb; do
            dpkg-deb --extract "$deb" "$root"
          done
          session="$root/usr/share/wayland-sessions/unbound.desktop"
          grep -qx 'Type=Application' "$session"
          grep -qx 'Name=Unbound' "$session"
          grep -qx 'Exec=unbound-session' "$session"
          grep -qx 'DesktopNames=Unbound' "$session"
          test -x "$root/usr/bin/unbound-session"
          sh -n "$root/usr/bin/unbound-session"
          units=$(mktemp -d)
          cp "$root"/usr/lib/systemd/user/* "$units/"
          sed -i "s|^ExecStart=/|ExecStart=$root/|" "$units"/*
          grep -qx 'Type=notify' "$units/unbound-compositor.service"
          grep -qx 'BindsTo=graphical-session.target' "$units/unbound-compositor.service"
          ! grep -l 'WantedBy=graphical-session.target' "$units"/*
          export XDG_RUNTIME_DIR=$(mktemp -d)
          findings=$(cd "$units" && SYSTEMD_LOG_LEVEL=warning systemd-analyze --user verify ./* 2>&1) || true
          echo "$findings"
          test -z "$findings"
      - name: Check the portal backend's registration
        run: |
          root=$(mktemp -d)
          dpkg-deb --extract target/debian/xdg-desktop-portal-unbound_*.deb "$root"
          portal="$root/usr/share/xdg-desktop-portal/portals/unbound.portal"
          service="$root/usr/share/dbus-1/services/org.freedesktop.impl.portal.desktop.unbound.service"
          grep -qx 'DBusName=org.freedesktop.impl.portal.desktop.unbound' "$portal"
          grep -qx 'Name=org.freedesktop.impl.portal.desktop.unbound' "$service"
          test -x "$root$(sed -n 's/^Exec=//p' "$service")"
          grep -q '^org.freedesktop.impl.portal.Settings=unbound;' \
            "$root/usr/share/xdg-desktop-portal/unbound-portals.conf"
      - name: Smoke-test the packaged settings service
        run: |
          root=$(mktemp -d)
          dpkg-deb --extract target/debian/unbound-config_*.deb "$root"
          export XDG_CONFIG_HOME=$(mktemp -d)
          mkdir -p "$XDG_CONFIG_HOME/unbound"
          echo 'panel { edge "top"; }' > "$XDG_CONFIG_HOME/unbound/config.kdl"
          dbus-run-session -- bash -c '
            "$1/usr/bin/unbound-config" &
            daemon=$!
            for attempt in $(seq 50); do
              reply=$(dbus-send --session --print-reply --dest=org.unbound.Config /org/unbound/Config \
                org.freedesktop.DBus.Properties.Get string:org.unbound.Config string:PanelEdge 2>/dev/null) \
                && break
              sleep 0.1
            done
            kill "$daemon"
            echo "$reply"
            grep -q "string \"top\"" <<< "$reply"
          ' bash "$root"
      - name: Smoke-test the packaged compositor
        run: |
          root=$(mktemp -d)
          dpkg-deb --extract target/debian/unbound-compositor_*.deb "$root"
          export XDG_RUNTIME_DIR=$(mktemp -d)
          status=0
          timeout 10 "$root/usr/bin/unbound-compositor" --headless > "$root/stdout" || status=$?
          cat "$root/stdout"
          test "$status" = 124
          grep -q '^WAYLAND_DISPLAY=wayland-' "$root/stdout"
      - uses: actions/upload-artifact@v7
        with:
          name: unbound-debs-arm64
          path: target/debian/*.deb
          if-no-files-found: error

  vm:
    name: ci/vm
    runs-on: [self-hosted, unbound]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Install build and guest dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libgbm-dev libinput-dev libseat-dev libudev-dev libpipewire-0.3-dev libclang-dev jq e2fsprogs qemu-system-arm
      - name: Build or reuse the guest kernel and root image
        run: ci/vm/images.sh vm
      - name: Run the guest tests in a KVM guest with vkms and virtio-gpu
        run: ci/vm/guest-tests.sh vm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screendumps
          path: screendumps/*.png
          if-no-files-found: ignore

  polkit:
    name: ci/polkit
    runs-on: [self-hosted, unbound]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Build the polkitd test
        run: |
          cargo test --package unbound-polkit --test polkitd --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "polkitd") | .executable // empty' \
            > polkitd-test-path
          test -s polkitd-test-path
      - name: Authenticate through the agent against polkitd on Debian 13
        run: |
          image=unbound-polkit-test:${{ github.sha }}
          docker build --quiet --tag "$image" crates/unbound-polkit/tests/polkitd
          container=$(docker create "$image")
          trap 'docker rm --force "$container" >/dev/null; docker rmi "$image" >/dev/null' EXIT
          docker cp "$(cat polkitd-test-path)" "$container:/polkitd-test"
          docker start --attach "$container"

  portal:
    name: ci/portal
    needs: [deb]
    runs-on: [self-hosted, unbound]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: unbound-debs-arm64
          path: portal-test
      - name: Read the colour scheme through xdg-desktop-portal on Debian 13
        run: |
          cp crates/xdg-desktop-portal-unbound/tests/frontend/* portal-test/
          image=unbound-portal-test:${{ github.sha }}
          docker build --quiet --tag "$image" portal-test
          trap 'docker rmi --force "$image" >/dev/null' EXIT
          docker run --rm "$image"

  perf:
    name: ci/perf
    needs: [test, deb, vm]
    runs-on: [self-hosted, unbound]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libgbm-dev libinput-dev libseat-dev libudev-dev libvulkan1 mesa-vulkan-drivers
      - run: cargo build --release --locked --package unbound-compositor --package unbound-bench
      - name: Measure against the budgets in docs/RENDERING.md
        shell: bash
        run: |
          target/release/unbound-bench \
            --compositor target/release/unbound-compositor --json perf.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf
          path: perf.json
          if-no-files-found: ignore
      - name: Install the toolkit sample's fonts and libraries
        run: |
          sudo apt-get install -y --no-install-recommends fonts-inter libfontconfig1 libwayland-client0
      - run: cargo build --release --locked --package unbound-sample --package unbound-bench
      - name: Measure the toolkit sample against the budgets in docs/RENDERING.md
        shell: bash
        run: |
          target/release/unbound-toolkit-bench \
            --sample target/release/unbound-sample --json perf-toolkit.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-toolkit
          path: perf-toolkit.json
          if-no-files-found: ignore
