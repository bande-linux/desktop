[package]
name = "bande-file-chooser"
description = "Bande Open and Save dialogs for the xdg-desktop-portal FileChooser"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
tracing.workspace = true
bande-files.workspace = true
bande-fs.workspace = true
bande-l10n.workspace = true
bande-log.workspace = true
bande-toolkit.workspace = true
bande-volumes.workspace = true
bande-wallpaper.workspace = true
bande-xdg.workspace = true
xdg-desktop-portal-bande.workspace = true

[dev-dependencies]
tempfile.workspace = true
bande-golden.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter"
extended-description = """\
The Open and Save dialogs of the Bande desktop, shown by \
xdg-desktop-portal-bande for every app that asks the FileChooser portal: \
favourite places and volumes in a sidebar, a path bar, a sortable list \
with type-to-jump, file type filters, New Folder when saving, and the last \
folder remembered for each app."""
assets = [
    ["target/release/bande-file-chooser", "usr/libexec/", "755"],
]

[lints]
workspace = true
