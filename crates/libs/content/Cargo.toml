[package]
name = "bande-content"
description = "File contents for Bande's Glance, Files and Viewer: images, PDF in a confined renderer, text, documents, fonts, folders and archives"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
hayro.workspace = true
image = { workspace = true, features = ["bmp", "gif", "ico", "jpeg", "tiff", "webp"] }
jxl-oxide.workspace = true
kamadak-exif.workspace = true
libheif-rs.workspace = true
quick-xml.workspace = true
resvg = { workspace = true, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
rustix = { workspace = true, features = ["fs", "process", "thread"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
zip.workspace = true
bande-fs.workspace = true
bande-inbox.workspace = true
bande-xdg.workspace = true

[lints]
workspace = true
