[package]
name = "bande-settings"
description = "Bande System Settings: panes for the desktop and its devices with ranked search"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
jiff.workspace = true
rustix = { workspace = true, features = ["fs"] }
tracing.workspace = true
bande-app-menu.workspace = true
bande-audio.workspace = true
bande-bluetooth.workspace = true
bande-config.workspace = true
bande-datetime.workspace = true
bande-fs.workspace = true
bande-keyboard.workspace = true
bande-l10n.workspace = true
bande-log.workspace = true
bande-network.workspace = true
bande-notify.workspace = true
bande-packages.workspace = true
bande-settings-panes.workspace = true
bande-sound.workspace = true
bande-status.workspace = true
bande-toolkit.workspace = true
bande-wallpaper.workspace = true
bande-watch.workspace = true
bande-xdg.workspace = true
