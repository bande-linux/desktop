[package]
name = "unbound-term"
description = "Unbound terminal: a PTY terminal on the Unbound toolkit"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
alacritty_terminal.workspace = true
unbound-config.workspace = true
unbound-toolkit.workspace = true

[dev-dependencies]
image.workspace = true
image-compare.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-dejavu-core, fonts-inter"
extended-description = """\
The terminal of the Unbound desktop: xterm-compatible emulation with \
10,000 lines of scrollback, Super+C and Super+V for the clipboard so \
that Control+C stays the interrupt, and the light or dark appearance \
of config.kdl."""
assets = [
    ["target/release/unbound-term", "usr/bin/", "755"],
    ["data/unbound-term.desktop", "usr/share/applications/", "644"],
    ["data/unbound-term.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[lints]
workspace = true
