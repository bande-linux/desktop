[lints]
workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter, fonts-manrope, pkexec, util-linux, systemd"
extended-description = """\
The window of the Bande recovery environment and install USB: install or \
reinstall Bande, keeping your files, go back to a previous version, restore \
from a backup, and open Disks and Terminal."""
assets = [
    ["target/release/bande-recovery-tools", "usr/bin/", "755"],
    ["data/org.bande.RecoveryTools.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.RecoveryTools.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.RecoveryTools.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]
