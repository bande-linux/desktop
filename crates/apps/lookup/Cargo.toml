[package]
name = "bande-lookup"
description = "Bande Look Up: dictionary panel at the pointer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
tracing.workspace = true
bande-app.workspace = true
bande-inbox.workspace = true
bande-l10n.workspace = true
bande-toolkit.workspace = true
bande-xdg.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-dejavu-core, fonts-inter, fonts-manrope, fonts-jetbrains-mono"
recommends = "bande-dict-en, bande-dict-sv"
extended-description = """\
Shows what a word means in a small panel at the pointer, from the dictionary \
packs installed on the computer. Started only when asked; nothing stays running."""
assets = [
    ["target/release/bande-lookup", "usr/bin/", "755"],
    ["data/org.bande.Lookup.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Lookup.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.Lookup.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/org.bande.Lookup.service", "usr/share/dbus-1/services/", "644"],
]

[lints]
workspace = true
