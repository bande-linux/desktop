[package]
name = "bande-polkit"
description = "Bande polkit authentication agent"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "bande-polkit-agent"
path = "src/main.rs"

[dependencies]
accesskit.workspace = true
blocking.workspace = true
rustix.workspace = true
tracing.workspace = true
bande-inbox.workspace = true
bande-l10n.workspace = true
bande-log.workspace = true
bande-toolkit.workspace = true
zbus.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
bande-golden.workspace = true
bande-test-bus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, polkitd, fonts-inter, init-system-helpers (>= 1.66)"
extended-description = """\
The polkit authentication agent of the Bande desktop. When an app asks \
for an administrator's permission, for example Settings changing the time \
zone or the computer's name, it shows a password dialog with the reason \
polkit gives, says who is asked for, shakes and asks again after a wrong \
password, and cancels with Escape. Started with the graphical session."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/bande-polkit-agent", "usr/bin/", "755"],
    ["data/bande-polkit-agent.service", "usr/lib/systemd/user/", "644"],
]

[lints]
workspace = true
