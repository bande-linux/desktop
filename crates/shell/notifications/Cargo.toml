[package]
name = "unbound-notifications"
description = "Unbound notification banners and Notification Center"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
jiff.workspace = true
tracing.workspace = true
unbound-datetime.workspace = true
unbound-inbox.workspace = true
unbound-l10n.workspace = true
unbound-log.workspace = true
unbound-notify.workspace = true
unbound-spring.workspace = true
unbound-toolkit.workspace = true
unbound-xdg.workspace = true
zbus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter, unbound-notify"
extended-description = """\
Draws the notifications of the Unbound desktop: banners that slide in \
below the menu bar at the top right, stack per app and can be swiped \
away, and the Notification Center that keeps them, opened from the clock \
in the menu bar. unbound-compositor starts it and keeps it running."""
assets = [
    ["target/release/unbound-notifications", "usr/bin/", "755"],
]

[lints]
workspace = true
