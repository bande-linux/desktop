[package]
name = "xdg-desktop-portal-unbound"
description = "Unbound backend for xdg-desktop-portal"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
blocking = "=1.7.0"
tracing.workspace = true
unbound-bus.workspace = true
unbound-graphics.workspace = true
unbound-log.workspace = true
zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true
unbound-config.workspace = true
unbound-test-bus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, xdg-desktop-portal (>= 1.18), dbus-session-bus | default-dbus-session-bus"
recommends = "unbound-config, xdg-desktop-portal-gtk"
extended-description = """\
Implements xdg-desktop-portal's Settings backend for the Unbound desktop: \
the colour scheme, accent colour and Reduce Motion follow config.kdl, so \
GTK, libadwaita and Qt apps follow them. Open and Save dialogs and the \
other interfaces Unbound does not show yet come from the GTK backend, and \
secrets from GNOME Keyring."""
assets = [
    ["target/release/xdg-desktop-portal-unbound", "usr/libexec/", "755"],
    ["data/xdg-desktop-portal-unbound.service", "usr/lib/systemd/user/", "644"],
    ["data/org.freedesktop.impl.portal.desktop.unbound.service", "usr/share/dbus-1/services/", "644"],
    ["data/unbound.portal", "usr/share/xdg-desktop-portal/portals/", "644"],
    ["data/unbound-portals.conf", "usr/share/xdg-desktop-portal/", "644"],
]

[lints]
workspace = true
