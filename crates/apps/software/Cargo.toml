[package]
name = "bande-software"
description = "software centre for the Bande desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
accesskit.workspace = true
bande-app.workspace = true
bande-app-menu.workspace = true
bande-datetime.workspace = true
bande-fs.workspace = true
flate2.workspace = true
image.workspace = true
jiff.workspace = true
jxl-oxide.workspace = true
rustls.workspace = true
ureq.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
sha2.workspace = true
tracing.workspace = true
zbus.workspace = true
bande-inbox.workspace = true
bande-l10n.workspace = true
bande-notify.workspace = true
bande-packages.workspace = true
bande-search.workspace = true
bande-toolkit.workspace = true
bande-xdg.workspace = true

[lints]
workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "admin"
depends = "$auto, appstream, packagekit, fonts-inter, fonts-manrope, fonts-jetbrains-mono"
recommends = "bande-polkit, bande-settings"
extended-description = """\
Software, the software centre of the Bande desktop: browse and search the apps Debian \
describes with AppStream, read about them before installing, and hide apps \
that need X11, which Bande does not run. When flatpak is installed and a \
Flatpak remote is configured, it lists that remote's apps too."""
assets = [
    ["target/release/bande-software", "usr/bin/", "755"],
    ["data/org.bande.Software.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Software.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["target/release/deb-assets/bande-software/org.bande.Software.metainfo.xml", "usr/share/metainfo/", "644"],
    ["target/release/deb-assets/bande-software/copyright", "usr/share/doc/bande-software/copyright", "644"],
    ["target/release/deb-assets/bande-software/changelog.gz", "usr/share/doc/bande-software/", "644"],
    ["data/lintian-overrides", "usr/share/lintian/overrides/bande-software", "644"],
    ["target/release/deb-assets/bande-software/man/*", "usr/share/man/man1/", "644"],
    ["target/release/l10n/development/bande-software/*", "usr/share/bande/l10n/bande-software/", "644"],
]
