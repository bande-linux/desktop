[package]
name = "bande-toolkit-platform"
description = "Bande toolkit platform: Wayland windows, input, clipboard, run loop and accessibility"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
accesskit_unix.workspace = true
raw-window-handle.workspace = true
rustix = { workspace = true, features = ["fs", "pipe", "time"] }
tracing.workspace = true
bande-bus.workspace = true
bande-graphics = { workspace = true, features = ["gpu"] }
bande-l10n.workspace = true
bande-protocols = { workspace = true, features = ["client"] }
bande-widgets.workspace = true
wayland-backend = { workspace = true, features = ["client_system", "dlopen"] }
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
wgpu.workspace = true
xkbcommon = { workspace = true, features = ["wayland"] }
zbus.workspace = true

[lints]
workspace = true
