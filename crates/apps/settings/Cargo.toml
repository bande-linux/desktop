[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, bande-icon-theme, fonts-inter, fonts-manrope, fonts-jetbrains-mono, bande-config, locales, pkexec, systemd, udev, xkb-data, network-manager"
extended-description = """\
System Settings of the Bande desktop in four groups: Connections \
(Wi-Fi with known networks, per-network details and hidden networks, \
Bluetooth, network), Desktop (appearance and wallpaper, the bar, \
notifications per app, accessibility), Devices (displays, sound, keyboard, \
trackpad and mouse) and System (power, users and groups, apps that open at login, language \
and time, about this computer with storage and software update), with a \
search field that ranks the matching settings and marks them. Every pane \
follows changes made elsewhere while it is open. Desktop settings go \
through org.bande.Config, which writes config.kdl. A polkit rule lets \
administrators (members of sudo) change the time, language, login screen \
keyboard layouts and computer name without a password prompt. Any \
supported language can be chosen; it is generated with locale-gen. Updates install \
through PackageKit while the computer runs; only those that need a \
restart install at the next restart, through PackageKit's offline \
updates. Settings asks to log out or reopen apps that still run the old \
version, and never restarts or logs out by itself."""
recommends = "accountsservice, bande-polkit, cryptsetup-bin, bluez, pipewire, wireplumber, bande-notify, packagekit, power-profiles-daemon, upower"
maintainer-scripts = "debian/"
assets = [
    ["target/release/bande-settings", "usr/bin/", "755"],
    ["data/org.bande.Settings.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Settings.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.Settings.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/bande-update-check.service", "usr/lib/systemd/user/", "644"],
    ["data/bande-update-check.timer", "usr/lib/systemd/user/", "644"],
    ["data/bande-went-back.service", "usr/lib/systemd/user/", "644"],
    ["data/bande-update-finish.path", "usr/lib/systemd/user/", "644"],
    ["data/bande-update-finish.service", "usr/lib/systemd/user/", "644"],
    ["data/50-bande-settings.rules", "usr/share/polkit-1/rules.d/", "644"],
    ["target/release/bande-sharing-helper", "usr/libexec/", "755"],
    ["data/org.bande.sharing-helper.policy", "usr/share/polkit-1/actions/", "644"],
    ["target/release/bande-locale-helper", "usr/libexec/", "755"],
    ["data/org.bande.locale-helper.policy", "usr/share/polkit-1/actions/", "644"],
    ["data/bande-disk-encryption", "usr/libexec/", "755"],
    ["data/bande-disk-encryption.service", "usr/lib/systemd/system/", "644"],
]

[lints]
workspace = true
