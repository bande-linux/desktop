[package]
name = "unbound-dock"
description = "Unbound Dock: kept and running apps on a screen edge"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
jiff.workspace = true
unbound-xdg.workspace = true
unbound-config.workspace = true
unbound-toolkit.workspace = true

[dev-dependencies]
image.workspace = true
image-compare.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter"
extended-description = """\
The Dock of the Unbound desktop: the apps kept in it and the running \
apps, with a clock. unbound-compositor starts it on the screen edge \
named in config.kdl."""

[lints]
workspace = true
