name: extended

on:
  workflow_dispatch:

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: always
  RUSTC_WRAPPER: sccache

jobs:
  vm:
    name: ci/vm
    runs-on: [self-hosted, bande-kvm]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: ci/target-dir.sh
      - name: Install build and guest dependencies
        run: ci/apt-install.sh pkg-config libxkbcommon-dev libgbm-dev libinput-dev libseat-dev libudev-dev libpipewire-0.3-dev libclang-dev jq e2fsprogs qemu-system-arm
      - name: Build or reuse the guest kernel and root image
        run: ci/vm/images.sh vm
      - name: Run the guest tests in a KVM guest with vkms and virtio-gpu
        env:
          GUEST_TIMEOUT: '2700'
        run: ci/vm/guest-tests.sh vm
      - name: Sign in through greetd, PAM and logind in a guest booted with systemd
        continue-on-error: true
        run: ci/vm/login-test.sh vm
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screendumps
          path: screendumps/*.png
          if-no-files-found: ignore

  polkit:
    name: ci/polkit
    runs-on: [self-hosted, bande]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: ci/target-dir.sh
      - name: Build the polkitd test
        run: |
          cargo test --package bande-polkit --test polkitd --locked --no-run --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .target.name == "polkitd") | .executable // empty' \
            > polkitd-test-path
          test -s polkitd-test-path
      - name: Authenticate through the agent against polkitd on Debian 13
        run: |
          image=bande-polkit-test:${{ github.sha }}
          docker build --quiet --tag "$image" crates/services/polkit/tests/polkitd
          container=$(docker create "$image")
          trap 'docker rm --force "$container" >/dev/null; docker rmi "$image" >/dev/null' EXIT
          docker cp "$(cat polkitd-test-path)" "$container:/polkitd-test"
          docker start --attach "$container"

  perf:
    name: ci/perf
    runs-on: [self-hosted, bande]
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      - run: ci/target-dir.sh
      - name: Install the build and runtime dependencies
        run: ci/apt-install.sh pkg-config libxkbcommon-dev libgbm-dev libinput-dev libseat-dev libudev-dev libpipewire-0.3-dev libclang-dev libvulkan1 mesa-vulkan-drivers fonts-inter fonts-manrope fonts-jetbrains-mono libfontconfig1 libwayland-client0
      - name: Build the release binaries and the benchmarks
        env:
          CARGO_BUILD_JOBS: '1'
        run: |
          mapfile -t packages < ci/release/packages
          cargo build --profile dist --locked "${packages[@]/#/--package=}" --package bande-bench --package bande-sample
      - name: Measure against the budgets in docs/decisions/0001-rendering.md
        shell: bash
        run: |
          target/dist/bande-bench \
            --compositor target/dist/bande-compositor --json perf.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf
          path: perf.json
          if-no-files-found: ignore
      - name: Measure the toolkit sample against the budgets in docs/decisions/0001-rendering.md
        shell: bash
        run: |
          target/dist/bande-toolkit-bench \
            --sample target/dist/bande-sample --json perf-toolkit.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-toolkit
          path: perf-toolkit.json
          if-no-files-found: ignore
      - name: Install the runtime dependencies of an idle session
        run: ci/apt-install.sh dbus-daemon libglib2.0-bin libpipewire-0.3-0t64 libpam0g
      - name: Measure wakeups of an idle session against the budget
        shell: bash
        run: |
          home=$(mktemp -d)
          mkdir -m 700 "$home/run"
          env -i PATH=/usr/bin:/bin HOME="$home" XDG_RUNTIME_DIR="$home/run" LANG=C.UTF-8 \
            dbus-run-session --config-file=crates/testing/test-bus/data/session.conf -- \
            target/dist/bande-idle --json perf-idle.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: perf-idle
          path: perf-idle.json
          if-no-files-found: ignore
