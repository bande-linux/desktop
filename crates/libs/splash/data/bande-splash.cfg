# The Bande boot screen needs Plymouth's kernel option, and loglevel=3 keeps the kernel's error messages off the screen before Plymouth starts; Settings ▸ About ▸ Show a boot screen comments out the next line to turn both off.
case " $GRUB_CMDLINE_LINUX_DEFAULT " in *" splash "*) ;; *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT splash" ;; esac; case " $GRUB_CMDLINE_LINUX_DEFAULT " in *" loglevel="*) ;; *) GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT loglevel=3" ;; esac
