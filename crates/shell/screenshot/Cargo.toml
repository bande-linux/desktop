[package]
name = "bande-screenshot"
description = "Bande screenshots: saves pictures of the screen or of a dragged-out area"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
blocking.workspace = true
image.workspace = true
jiff.workspace = true
pipewire = { workspace = true, features = ["v0_3_34"] }
rustix = { workspace = true, features = ["event", "fs", "process", "time"] }
tracing.workspace = true
bande-datetime.workspace = true
bande-fs.workspace = true
bande-graphics.workspace = true
bande-inbox.workspace = true
bande-l10n.workspace = true
bande-log.workspace = true
bande-notify.workspace = true
bande-protocols = { workspace = true, features = ["client"] }
bande-sound.workspace = true
bande-toolkit.workspace = true
bande-xdg.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
zbus.workspace = true

[dev-dependencies]
serde.workspace = true
smithay.workspace = true
tempfile.workspace = true
bande-compositor.workspace = true
bande-golden.workspace = true
bande-test-bus.workspace = true
bande-test-wayland.workspace = true
xdg-desktop-portal-bande.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto"
recommends = "pipewire, gstreamer1.0-tools, gstreamer1.0-pipewire, gstreamer1.0-plugins-good, gstreamer1.0-plugins-ugly"
extended-description = """\
The screenshot tool of the Bande desktop. Super+Shift+3 saves a picture \
of the whole screen, and Super+Shift+4 one of an area dragged out with the \
pointer, to the desktop folder as a PNG named after the moment it was taken. \
It also captures the screen and windows for the desktop portal: the picker \
for screen sharing, the PipeWire streams, and screenshots apps ask for. \
bande-compositor starts it and keeps it running."""

[lints]
workspace = true
