[package]
name = "bande-screen-sharing"
description = "Bande Screen Sharing: lets VNC viewers on the local network see and control the screen"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[features]
default = ["service"]
service = [
    "dep:bande-bus",
    "dep:bande-config",
    "dep:bande-discovery",
    "dep:bande-keyring",
    "dep:bande-l10n",
    "dep:bande-log",
    "dep:bande-notify",
    "dep:des",
    "dep:flate2",
    "dep:pipewire",
    "dep:rcgen",
    "dep:reis",
    "dep:ring",
    "dep:rustix",
    "dep:rustls",
    "dep:tracing",
    "dep:zbus",
]

[[bin]]
name = "bande-screen-sharing"
required-features = ["service"]

[dependencies]
libc.workspace = true
sha2.workspace = true
bande-xdg.workspace = true
bande-bus = { workspace = true, optional = true }
bande-config = { workspace = true, optional = true }
bande-discovery = { workspace = true, optional = true }
bande-keyring = { workspace = true, optional = true }
bande-l10n = { workspace = true, optional = true }
bande-log = { workspace = true, optional = true }
bande-notify = { workspace = true, optional = true }
des = { workspace = true, optional = true }
flate2 = { workspace = true, optional = true }
pipewire = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true }
reis = { workspace = true, optional = true }
ring = { workspace = true, optional = true }
rustix = { workspace = true, optional = true, features = ["event", "net"] }
rustls = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
zbus = { workspace = true, optional = true }

[lints]
workspace = true
