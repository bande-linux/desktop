[package]
name = "unbound-menubar"
description = "Unbound menu bar: names the active app and shows the date and time"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
jiff.workspace = true
unbound-xdg.workspace = true
unbound-config.workspace = true
unbound-toolkit.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter"
extended-description = """\
The menu bar of the Unbound desktop: a bar along the top of the screen \
that names the active app in bold and shows the date and time at its \
right end, as the macOS menu bar does. unbound-compositor starts it and \
keeps it running."""

[lints]
workspace = true
