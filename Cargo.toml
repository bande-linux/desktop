bande-keyring = { path = "crates/libs/keyring" }
bande-l10n = { path = "crates/libs/l10n" }
bande-l10n-macros = { path = "crates/libs/l10n-macros" }
bande-l10n-source = { path = "crates/libs/l10n-source" }
bande-launcher = { path = "crates/shell/launcher" }
bande-lock = { path = "crates/shell/lock" }
bande-log = { path = "crates/libs/log" }
bande-lookup = { path = "crates/apps/lookup" }
bande-media = { path = "crates/libs/media" }
bande-media-view = { path = "crates/libs/media-view" }
bande-network = { path = "crates/libs/network" }
