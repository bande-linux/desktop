[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/unbound-linux/desktop"

[workspace.dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png"] }
image-compare = "=0.5.0"
pollster = "=1.0.1"
smithay = { version = "=0.7.0", default-features = false, features = ["wayland_frontend"] }
tempfile = "=3.27.0"
wayland-client = "=0.31.15"
wayland-protocols = { version = "=0.32.13", features = ["client"] }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
