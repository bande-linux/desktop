[package]
name = "unbound-settings"
description = "Unbound System Settings: panes for the desktop and its devices with ranked search"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
jiff.workspace = true
rustix = { workspace = true, features = ["fs"] }
tracing.workspace = true
unbound-app-menu.workspace = true
unbound-audio.workspace = true
unbound-bluetooth.workspace = true
unbound-config.workspace = true
unbound-datetime.workspace = true
unbound-fs.workspace = true
unbound-keyboard.workspace = true
unbound-l10n.workspace = true
unbound-log.workspace = true
unbound-network.workspace = true
unbound-notify.workspace = true
unbound-settings-panes.workspace = true
unbound-sound.workspace = true
unbound-toolkit.workspace = true
unbound-wallpaper.workspace = true
unbound-xdg.workspace = true
wayland-client.workspace = true
wayland-protocols-wlr.workspace = true
zbus.workspace = true

[dev-dependencies]
tempfile.workspace = true
unbound-compositor.workspace = true
unbound-golden.workspace = true
unbound-test-bus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter, unbound-config"
extended-description = """\
System Settings of the Unbound desktop in four groups: Connections \
(Wi-Fi, Bluetooth, network), Desktop (appearance and wallpaper, the bar, \
notifications per app, accessibility), Devices (displays, sound, keyboard, \
trackpad and mouse) and System (power, apps that open at login, language \
and time, about this computer with storage and software update), with a \
search field that ranks the matching settings and marks them. Every pane \
follows changes made elsewhere while it is open. Desktop settings go \
through org.unbound.Config, which writes config.kdl. A polkit rule lets \
administrators (members of sudo) change the time, language, computer \
name and install updates without a password prompt."""
recommends = "network-manager, bluez, pipewire, wireplumber, unbound-notify, packagekit, power-profiles-daemon, upower"
maintainer-scripts = "debian/"
assets = [
    ["target/release/unbound-settings", "usr/bin/", "755"],
    ["data/org.unbound.Settings.desktop", "usr/share/applications/", "644"],
    ["data/org.unbound.Settings.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/unbound-update-check.service", "usr/lib/systemd/user/", "644"],
    ["data/unbound-update-check.timer", "usr/lib/systemd/user/", "644"],
    ["data/50-unbound-settings.rules", "usr/share/polkit-1/rules.d/", "644"],
]

[lints]
workspace = true
