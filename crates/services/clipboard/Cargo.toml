[package]
name = "unbound-clipboard"
description = "Unbound clipboard daemon: keeps the selection after the copying app quits and remembers recent copies"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
rustix.workspace = true
tracing.workspace = true
unbound-inbox.workspace = true
unbound-log.workspace = true
unbound-xdg.workspace = true
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
zbus.workspace = true

[dev-dependencies]
smithay.workspace = true
tempfile.workspace = true
unbound-compositor.workspace = true
unbound-test-bus.workspace = true
unbound-test-wayland.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
extended-description = """\
Takes over each new clipboard and primary selection through \
ext-data-control-v1 and serves it after the copying application has \
quit. It also keeps the last 100 copies of the past week (never ones \
marked as passwords) in ~/.local/state/unbound/clipboard, readable by \
the user only, and offers them to the launcher on the session bus as \
org.unbound.Clipboard. unbound-compositor starts it on a socket pair and \
offers ext-data-control on that connection only."""

[lints]
workspace = true
