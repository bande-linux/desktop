[package]
name = "unbound-toolkit"
description = "Shared Unbound UI toolkit: design tokens, Vello drawing and Parley text"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
accesskit_unix.workspace = true
fontique.workspace = true
parley.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
rustix = { workspace = true, features = ["fs", "pipe"] }
skrifa.workspace = true
unbound-protocols = { workspace = true, features = ["client"] }
vello_cpu.workspace = true
vello_gpu.workspace = true
wayland-backend = { workspace = true, features = ["client_system", "dlopen"] }
wayland-client.workspace = true
wayland-protocols.workspace = true
wayland-protocols-wlr.workspace = true
wgpu.workspace = true
xkbcommon = { workspace = true, features = ["wayland"] }

[dev-dependencies]
accesskit.workspace = true
ab_glyph.workspace = true
image.workspace = true
smithay.workspace = true
unbound-compositor.workspace = true
unbound-test-bus.workspace = true
zbus.workspace = true
