[package]
name = "unbound-files"
description = "Unbound Files: the file manager of the Unbound desktop"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
rustix = { workspace = true, features = ["fs"] }
tracing.workspace = true
unbound-app-menu.workspace = true
unbound-fs.workspace = true
unbound-l10n.workspace = true
unbound-log.workspace = true
unbound-preview.workspace = true
unbound-search.workspace = true
unbound-sound.workspace = true
unbound-thumbnails.workspace = true
unbound-toolkit.workspace = true
unbound-volumes.workspace = true
unbound-xdg.workspace = true
zbus.workspace = true

[dev-dependencies]
image.workspace = true
rustix = { workspace = true, features = ["process"] }
tempfile.workspace = true
unbound-golden.workspace = true
unbound-l10n = { workspace = true, features = ["pseudo"] }

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-dejavu-core, fonts-inter"
extended-description = """\
The file manager of the Unbound desktop: folders open in Miller columns \
driven by the arrow keys, as in the Finder's column view, and Space shows \
the selected file in Quick Look."""
assets = [
    ["target/release/unbound-files", "usr/bin/", "755"],
    ["data/org.unbound.Files.desktop", "usr/share/applications/", "644"],
    ["data/org.unbound.Files.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
]

[lints]
workspace = true
