[package]
name = "bande-reporter"
description = "Bande fault reports: keeps a local report of each fault and sends it if sending is switched on"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
bande-log.workspace = true
flate2.workspace = true
jiff.workspace = true
ring.workspace = true
bande-https.workspace = true
rustc-demangle.workspace = true
rustix = { workspace = true, features = ["fs", "net", "stdio", "thread"] }
serde_json.workspace = true
tracing.workspace = true

[[bin]]
name = "bande-reporter"
path = "src/main.rs"

[[bin]]
name = "bande-diagnose"
path = "src/bin/diagnose.rs"

[lints]
workspace = true
