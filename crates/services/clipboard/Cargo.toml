[package]
name = "bande-clipboard"
description = "Bande clipboard daemon: keeps the selection after the copying app quits and remembers recent copies"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
rustix.workspace = true
tracing.workspace = true
bande-log.workspace = true
bande-xdg.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true
zbus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
extended-description = """\
Takes over each new clipboard and primary selection through \
ext-data-control-v1 and serves it after the copying application has \
quit. It also keeps the last 100 copies of the past week (never ones \
marked as passwords) in ~/.local/state/bande/clipboard, readable by \
the user only, and offers them to the launcher on the session bus as \
org.bande.Clipboard. bande-compositor starts it on a socket pair and \
offers ext-data-control on that connection only."""

[lints]
workspace = true
