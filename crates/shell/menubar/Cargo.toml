[package]
name = "unbound-menubar"
description = "Unbound menu bar: system menu, app menus, status items, status notifier items and the clock"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
jiff.workspace = true
tracing.workspace = true
unbound-app-menu.workspace = true
unbound-audio.workspace = true
unbound-bluetooth.workspace = true
unbound-datetime.workspace = true
unbound-inbox.workspace = true
unbound-l10n.workspace = true
unbound-log.workspace = true
unbound-network.workspace = true
unbound-toolkit.workspace = true
unbound-xdg.workspace = true
zbus.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter"
recommends = "upower, network-manager, bluez, pipewire, wireplumber, unbound-tray, unbound-notifications"
extended-description = """\
The menu bar of the Unbound desktop: the system menu (About, System \
Settings, Force Quit, Sleep, Restart, Shut Down, Lock Screen, Log Out) at \
the left, the active app in bold with its menus, and at the right the \
status notifier items of apps, Bluetooth, sound, Wi-Fi and battery with \
their menus, Control Center and the clock, which opens the Notification \
Center. unbound-compositor starts it and keeps it running."""

[lints]
workspace = true
