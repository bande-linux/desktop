[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/bande-linux/web"

[workspace.dependencies]
web-atoms = { path = "crates/web-atoms" }
web-dom = { path = "crates/web-dom" }
hashbrown = { version = "0.16", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.dev]
debug = "line-tables-only"
