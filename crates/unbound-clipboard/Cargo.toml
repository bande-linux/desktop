[package]
name = "unbound-clipboard"
description = "Unbound clipboard daemon: keeps the selection after the copying app quits"
version.workspace = true
edition.workspace = true
repository.workspace = true

[dependencies]
rustix.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true

[dev-dependencies]
smithay.workspace = true
tempfile.workspace = true
unbound-compositor.workspace = true
unbound-test-wayland.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "x11"
depends = "$auto, init-system-helpers (>= 1.66)"
extended-description = """\
Takes over each new clipboard and primary selection through \
ext-data-control-v1 and serves it after the copying application has \
quit. Runs as a systemd user service in the graphical session; the \
Unbound compositor offers ext-data-control to this executable only."""
maintainer-scripts = "debian/"
assets = [
    ["target/release/unbound-clipboard", "usr/bin/", "755"],
    ["debian/unbound-clipboard.service", "usr/lib/systemd/user/", "644"],
]
