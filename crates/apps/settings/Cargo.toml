[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter, bande-config, locales"
extended-description = """\
System Settings of the Bande desktop in four groups: Connections \
(Wi-Fi, Bluetooth, network), Desktop (appearance and wallpaper, the bar, \
notifications per app, accessibility), Devices (displays, sound, keyboard, \
trackpad and mouse) and System (power, apps that open at login, language \
and time, about this computer with storage and software update), with a \
search field that ranks the matching settings and marks them. Every pane \
follows changes made elsewhere while it is open. Desktop settings go \
through org.bande.Config, which writes config.kdl. A polkit rule lets \
administrators (members of sudo) change the time, language, login screen \
keyboard layouts and computer name without a password prompt. Any \
supported language can be chosen; localed generates it. Updates download \
in the background and install at the next restart through PackageKit's \
offline updates."""
recommends = "bande-polkit, network-manager, bluez, pipewire, wireplumber, bande-notify, packagekit, power-profiles-daemon, upower"
maintainer-scripts = "debian/"
assets = [
    ["target/release/bande-settings", "usr/bin/", "755"],
    ["data/org.bande.Settings.desktop", "usr/share/applications/", "644"],
    ["data/org.bande.Settings.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/org.bande.Settings.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/bande-update-check.service", "usr/lib/systemd/user/", "644"],
    ["data/bande-update-check.timer", "usr/lib/systemd/user/", "644"],
    ["data/50-bande-settings.rules", "usr/share/polkit-1/rules.d/", "644"],
]

[lints]
workspace = true
