version: "1.0"
description: "6-Tier Automated Quality Verification Funnel"
tiers:
  tier_0:
    name: "Syntactic, Lint & Dependency Security"
    tools:
      - cmd: "cargo check --workspace --all-targets"
        zero_tolerance: true
      - cmd: "cargo clippy --workspace --all-targets -- -D warnings"
        zero_tolerance: true
      - cmd: "cargo fmt --check"
        zero_tolerance: true
      - cmd: "cargo deny check"
        disallow_advisories: true

  tier_1:
    name: "Property-Based Testing"
    framework: "proptest"
    iterations: 10000
    scope: "Layout geometry, coordinate transforms, fractional scaling, buffer strides"

  tier_2:
    name: "IPC & Protocol Fuzzing"
    framework: "cargo-fuzz"
    duration_seconds: 600
    scope: "Wayland wire protocol deserialization, D-Bus message unpacking"

  tier_3:
    name: "Mutation Testing (Anti-Vacuity Gate)"
    tool: "cargo-mutants"
    min_mutation_score_percent: 90.0
    description: "Rejects agent-authored tests if >10% of injected AST mutations survive"

  tier_4:
    name: "Bounded Model Checking / Formal Verification"
    tool: "kani"
    scope: "Explicit sync fence queues, PAM session state machine transitions"

  tier_5:
    name: "Offscreen Visual Regression"
    pipeline: "wgpu-render-to-texture"
    metric: "SSIM"
    min_threshold: 0.995
    scope: "Panels, launcher, greeter, dialogs compared against golden reference textures"

  system_gate:
    name: "Debian 13 arm64 VM Boot (QEMU/KVM)"
    base_image: "ghcr.io/unbound-linux/ci-debian-13:latest"
    assertions:
      - "greetd.service active running"
      - "synthetic PAM login success"
      - "unbound-compositor binds wayland-1 and claims seat0"
      - "panels render without panic"
