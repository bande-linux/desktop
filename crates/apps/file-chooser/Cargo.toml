[package]
name = "bande-file-chooser"
description = "Bande dialogs for xdg-desktop-portal-bande: Open and Save, Open With, permissions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
tracing.workspace = true
bande-app-settings.workspace = true
bande-files.workspace = true
bande-fs.workspace = true
bande-l10n.workspace = true
bande-log.workspace = true
bande-toolkit.workspace = true
bande-volumes.workspace = true
bande-wallpaper.workspace = true
bande-xdg.workspace = true
xdg-desktop-portal-bande.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, fonts-inter"
extended-description = """\
The dialogs of xdg-desktop-portal-bande: the Bande Open and Save dialogs \
(favourite places and volumes in a sidebar, a path bar, a sortable list \
with type-to-jump, file type filters, New Folder when saving, and the last \
folder remembered for each app), Open With for links and files, permission \
questions, adding an app or web app to Applications, sharing the account's \
name and picture, and setting the desktop picture."""
assets = [
    ["target/release/bande-file-chooser", "usr/libexec/", "755"],
]

[lints]
workspace = true
