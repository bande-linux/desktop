[package]
name = "unbound-compositor"
description = "Unbound Wayland compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
accesskit.workspace = true
accesskit_unix.workspace = true
jiff.workspace = true
rustix = { workspace = true, features = ["time"] }
smithay = { workspace = true, features = ["backend_drm", "backend_gbm", "backend_libinput", "backend_session_libseat", "backend_udev", "desktop"] }
tracing.workspace = true
unbound-bus.workspace = true
unbound-config.workspace = true
unbound-datetime.workspace = true
unbound-edid.workspace = true
unbound-graphics.workspace = true
unbound-l10n.workspace = true
unbound-log.workspace = true
unbound-protocols = { workspace = true, features = ["server"] }
unbound-render.workspace = true
unbound-spring.workspace = true
unbound-widgets.workspace = true
unbound-xdg.workspace = true
zbus.workspace = true

[dev-dependencies]
image.workspace = true
image-compare.workspace = true
rustix = { workspace = true, features = ["fs", "mm"] }
tempfile.workspace = true
unbound-golden.workspace = true
unbound-greeter.workspace = true
unbound-keyboard.workspace = true
unbound-test-bus.workspace = true
unbound-test-wayland.workspace = true
wayland-client.workspace = true
wayland-protocols.workspace = true

[package.metadata.deb]
maintainer = "Mikael Hug <mikaelhug@gmail.com>"
section = "misc"
depends = "$auto, libvulkan1, mesa-vulkan-drivers | vulkan-icd, systemd"
recommends = "unbound-clipboard, unbound-shell, unbound-term, unbound-lock, unbound-screenshot, unbound-files, unbound-settings"
suggests = "fcitx5"
extended-description = """\
Wayland compositor for the Unbound desktop session, built on Smithay. It runs \
on a logind seat, drives the displays through DRM/KMS, reads input through \
libinput and composes windows with its own Vulkan renderer, scanning \
full-screen clients out directly when it can."""
assets = [
    ["target/release/unbound-compositor", "usr/bin/", "755"],
    ["data/unbound-session", "usr/bin/", "755"],
    ["data/unbound-compositor.service", "usr/lib/systemd/user/", "644"],
    ["data/unbound-session.target", "usr/lib/systemd/user/", "644"],
    ["data/unbound.desktop", "usr/share/wayland-sessions/", "644"],
    ["data/session-clients", "usr/share/unbound-compositor/", "644"],
]

[lints]
workspace = true
