name: dictionary packs
run-name: "Dictionary packs ${{ github.ref_name }}"

on:
  push:
    tags: ['dict-[0-9][0-9][0-9][0-9][0-9][0-9][0-9][0-9]']

concurrency:
  group: dict-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  suites:
    uses: bande-linux/apt/.github/workflows/suites.yml@main

  packs:
    name: packs (${{ matrix.suite }})
    needs: suites
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.suites.outputs.list) }}
    runs-on: ubuntu-24.04
    container: debian:${{ matrix.suite }}
    timeout-minutes: 120
    steps:
      - name: Install the tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates curl python3 dpkg-dev unzip xz-utils distro-info-data
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Check that the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build the packs from the pinned sources
        run: python3 packaging/dict/build.py "${GITHUB_REF_NAME#dict-}$(ci/deb/debian-release.sh)" /var/tmp/dict-sources target/dict
      - uses: actions/upload-artifact@v7
        with:
          name: bande-debs-${{ matrix.suite }}-all
          path: target/dict/*.deb
          if-no-files-found: error
